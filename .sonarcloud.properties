# Read by SonarCloud's Automatic Analysis (GitHub App) from the default branch. Wildcard patterns
# that match a *variable* path segment are not supported here, so every workspace's test/
# directory is listed explicitly rather than a glob like "packages/*/test" or "**/*.test.ts" - see
# AGENTS.md Compounding rules for why this exists: without it, every *.test.ts(x) file analyzes as
# production source (qualifier FIL instead of UTS), so intentional test-fixture duplication counts
# against the New Code Duplication gate. Also covers the shell test harnesses ci.yml runs outside
# any workspace test/ directory, and the fixtures they read.
sonar.tests=apps/web/test,apps/admin/test,apps/admin/e2e,apps/cli/test,packages/auth/test,packages/crypto/test,packages/db/test,packages/import/test,packages/location/test,packages/mail-delivery/test,packages/mail-templates/test,packages/mailer-config/test,packages/mailer/test,packages/shared/test,packages/storage/test,packages/tickets/test,packages/ui/test,packages/wallet/test,scripts/check-migrations-destructive.test.sh,scripts/test-migrate-entrypoint.sh,scripts/fixtures

# sonar.sources defaults to "." under Automatic Analysis, which re-includes every path above as
# source too - sonar.tests alone doesn't remove them from sonar.sources, so every listed path
# counted as both, and Automatic Analysis fails the whole project scan on that overlap ("source
# and test file paths overlap"). Mirrors sonar.tests exactly (with a trailing /** since these are
# exclusions, not the tests-classification list above) so each path is source-excluded and
# test-included, never both.
sonar.exclusions=apps/web/test/**,apps/admin/test/**,apps/admin/e2e/**,apps/cli/test/**,packages/auth/test/**,packages/crypto/test/**,packages/db/test/**,packages/import/test/**,packages/location/test/**,packages/mail-delivery/test/**,packages/mail-templates/test/**,packages/mailer-config/test/**,packages/mailer/test/**,packages/shared/test/**,packages/storage/test/**,packages/tickets/test/**,packages/ui/test/**,packages/wallet/test/**,scripts/check-migrations-destructive.test.sh,scripts/test-migrate-entrypoint.sh,scripts/fixtures/**,packages/db/prisma/migrations/**

# packages/db/prisma/migrations/** above is a plain exclusion, not paired with sonar.tests (these
# are neither production sources nor tests) - once a migration file is merged and applied, editing
# it for a Sonar finding is unsafe regardless of the finding's merit: Prisma checksums the file
# content, so any change (even a comment) breaks `prisma migrate deploy` drift detection on every
# environment that already ran it. Confirmed every open finding under this path before adding the
# exclusion (`api/issues/search?componentKeys=solarssk_admitto` filtered to the migrations path):
# all 9 were plsql:S1192/S1138/NullComparison/DeleteOrUpdateWithoutWhereCheck - the generic
# Oracle-oriented plsql analyzer misreading intentional Postgres backfills (UPDATE with no WHERE
# is correct when it's meant to touch every row) and `x = ''` vs `x IS NULL` (Postgres treats empty
# string and NULL as distinct values; Oracle doesn't, which is what that rule assumes). None were
# security-relevant - re-check that before ever widening this exclusion further.
