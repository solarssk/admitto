name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: admitto
          POSTGRES_PASSWORD: admitto
          POSTGRES_DB: admitto
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://admitto:admitto@localhost:5432/admitto
      # Fixed test key — 32 bytes. Not a production secret; used only in CI test runs.
      ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "22.22.3"
          cache: "npm"
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build -w @admitto/shared
      - run: npm run build -w @admitto/crypto
      - run: npm run build -w @admitto/db
      - run: npm run build -w @admitto/tickets
      - run: npm run build -w @admitto/mailer
      - run: npm run build -w @admitto/mailer-config
      - name: Create test databases
        run: bash infra/scripts/create-test-dbs.sh
      - name: Run database migrations
        run: npx prisma migrate deploy
        working-directory: packages/db
      - run: npm run typecheck --workspaces --if-present
      - run: npm test --workspaces --if-present
      - run: npm run build --workspaces --if-present

  lint:
    runs-on: ubuntu-latest
    env:
      # prisma generate (postinstall) reads schema.prisma only — never connects to a database.
      # A syntactically valid DSN is required by Prisma's schema parser; the host is intentionally unreachable.
      DATABASE_URL: postgresql://localhost/prisma-generate-placeholder
      # @admitto/crypto postinstall does not run; placeholder satisfies any import-time env checks.
      ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "22.22.3"
          cache: "npm"
      - run: npm ci
      - run: npm run lint

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          echo "ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --no-banner --redact --exit-code 1

  pii-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
      - name: No real email addresses in tracked data files
        run: |
          # -z / xargs -0: handle filenames with spaces correctly
          # domain anchor ($): prevent @example.com.evil bypass
          HITS=$(git ls-files -z '*.csv' '*.json' '*.tsv' \
            | xargs -0 grep -hREo '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' -- \
            | grep -viE '@(example\.(com|org|net)|test\.(com|org|net))$' || true)
          if [ -n "$HITS" ]; then
            echo "Suspicious real email addresses found in data files:"
            echo "$HITS"
            exit 1
          fi
          echo "OK: no real email addresses in data files"
