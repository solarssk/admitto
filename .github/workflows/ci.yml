name: CI

on:
  push:
    branches: [main]
  # No `branches:` filter here on purpose: stacked PRs (native GitHub stacks) have a base ref
  # that is another feature branch, not main, once the bottom-most PR in the stack has merged
  # and closed - GitHub's "evaluate as if targeting main" virtualization needs an unbroken chain
  # of open PRs down to main, and a merged/closed PR severs that chain. Restricting to
  # `branches: [main]` silently skipped required-status-check jobs (build-test, secret-scan,
  # pii-guard, analyze, migration-safety) for every PR in a stack after its first link merged.
  pull_request: {}

env:
  # Shared by every job below (only test-web/test-admin/test-rest actually use these; harmless
  # unused strings in lint-and-typecheck). Defined once at workflow level, not per-job.
  # No password: the Postgres service containers below run with POSTGRES_HOST_AUTH_METHOD=trust
  # (network-unreachable outside this job's own steps, so there's nothing to protect with a
  # password) — closes SonarCloud's hardcoded-secret rule (secrets:S6698) without a repo secret,
  # which would resolve to empty (and fail Postgres startup) on a fork-originated pull_request run
  # since GitHub withholds secrets from those by default (caught by Codex review on PR #570).
  DATABASE_URL: postgresql://admitto@localhost:5432/admitto
  REDIS_URL: redis://localhost:6379
  # Fixed test key — 32 bytes. Not a production secret; used only in CI test runs.
  ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

jobs:
  wiki-docs:
    # Dependabot PRs omit the human/agent PR template body. Skip this gate by PR author, not
    # github.actor: a human re-run sets actor to a person and would otherwise re-enable the
    # documentation-impact check against Dependabot's body. Push to main still runs as usual.
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24.17.0"
      - name: Validate Wiki source
        run: npm run docs:check
      - name: Validate pull request documentation impact
        if: github.event_name == 'pull_request'
        run: npm run docs:pr-check

  # build-test used to be one sequential job (~7-8 min, mostly the coverage step across all 14
  # workspaces). Split into 4 parallel jobs so they run concurrently instead of one after another
  # - free on this public repo (unlimited Actions minutes), only wall-clock time is at stake.
  # apps/web and apps/admin each get their own job since together they're ~75%+ of total test
  # volume; everything else is bundled into test-rest.
  lint-and-typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24.17.0"
          cache: "npm"
      # Supply-chain hardening (SonarCloud githubactions:S6505): --ignore-scripts skips every
      # dependency's install/postinstall script by default, instead of letting all ~900 of them
      # run silently and automatically. Only the packages this workflow has confirmed it actually
      # needs get their scripts run explicitly below — esbuild (its own binary, needed by every
      # vite/vitest/tsx step) and argon2 (its native password-hashing binding, needed by
      # packages/auth) via `npm rebuild`, and Prisma's query engine + generated client via its own
      # `prisma generate`. Adding a new dependency that also needs its install script to run means
      # adding it here explicitly, not silently inheriting it.
      - run: npm ci --ignore-scripts
      - name: Verify lockfile resolutions match package.json declarations
        run: python3 scripts/verify-lockfile-resolutions.py
      - run: npm rebuild esbuild argon2 @prisma/engines prisma @prisma/client
      - run: npm run db:generate -w @admitto/db
      - run: npm audit --audit-level=high
      - run: npm run build
      - name: Release doc version markers match package.json
        run: python3 scripts/sync-release-docs.py --check
      - run: npm run lint
      - run: npm run typecheck --workspaces --if-present

  test-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: admitto
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: admitto
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24.17.0"
          cache: "npm"
      # See lint-and-typecheck's own comment for why these two extra steps exist.
      - run: npm ci --ignore-scripts
      - run: npm rebuild esbuild argon2 @prisma/engines prisma @prisma/client
      - run: npm run db:generate -w @admitto/db
      - run: npm run build
      - name: Create test databases
        run: bash infra/scripts/create-test-dbs.sh
      - name: Migrate web integration test database
        env:
          DATABASE_URL: postgresql://admitto@localhost:5432/admitto_web_test
        working-directory: packages/db
        # --no-install: use only the already-installed, lockfile-pinned prisma binary, never an
        # on-demand npx download (SonarCloud githubactions:S6505 / S8543).
        run: npx --no-install prisma migrate deploy
      - name: Run coverage (also emits JUnit XML for Test Analytics)
        run: npm run coverage -w @admitto/web --if-present -- --reporter=default --reporter=junit --outputFile.junit=./junit.xml
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: web
          files: |
            apps/**/coverage/lcov.info
            apps/**/coverage-integration/lcov.info
          fail_ci_if_error: false
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3  # v1.2.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: web
          fail_ci_if_error: false

  test-admin:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24.17.0"
          cache: "npm"
      # See lint-and-typecheck's own comment for why these two extra steps exist.
      - run: npm ci --ignore-scripts
      - run: npm rebuild esbuild argon2 @prisma/engines prisma @prisma/client
      - run: npm run db:generate -w @admitto/db
      - run: npm run build
      - name: Run coverage (also emits JUnit XML for Test Analytics)
        run: npm run coverage -w @admitto/admin --if-present -- --reporter=default --reporter=junit --outputFile.junit=./junit.xml
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: admin
          files: |
            apps/**/coverage/lcov.info
            apps/**/coverage-integration/lcov.info
          fail_ci_if_error: false
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3  # v1.2.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: admin
          fail_ci_if_error: false

  # Every remaining workspace. packages/db and packages/tickets both target the same
  # admitto_tickets_test database and both destructively reset its schema in their own beforeAll
  # (prisma migrate reset / db push --force-reset) - they must stay in this one job, never split
  # into separate concurrent jobs against each other, or a schema reset can race a live query in
  # the other package's suite. Every other workspace here (auth/import/mail-delivery/
  # mail-templates/mailer/mailer-config/crypto/ui/cli) already has its own uniquely-named test
  # database (or none at all), verified with an Explore agent before this split was written.
  test-rest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: admitto
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: admitto
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24.17.0"
          cache: "npm"
      # See lint-and-typecheck's own comment for why these two extra steps exist.
      - run: npm ci --ignore-scripts
      - run: npm rebuild esbuild argon2 @prisma/engines prisma @prisma/client
      - run: npm run db:generate -w @admitto/db
      - run: npm run build
      - name: Create test databases
        run: bash infra/scripts/create-test-dbs.sh
      - name: Run database migrations and agency public_ref backfill
        run: npm run db:migrate -w @admitto/db
      - name: Migrate auth integration test database
        env:
          DATABASE_URL: postgresql://admitto@localhost:5432/admitto_auth_test
        working-directory: packages/db
        # --no-install: use only the already-installed, lockfile-pinned prisma binary, never an
        # on-demand npx download (SonarCloud githubactions:S6505 / S8543).
        run: npx --no-install prisma migrate deploy
      - name: Run coverage (also emits JUnit XML per workspace for Test Analytics)
        run: >-
          npm run coverage --if-present
          -w @admitto/db -w @admitto/tickets -w @admitto/auth -w @admitto/import
          -w @admitto/mail-delivery -w @admitto/mail-templates -w @admitto/mailer
          -w @admitto/mailer-config -w @admitto/crypto -w @admitto/storage -w @admitto/location -w @admitto/ui -w @admitto/cli
          -w @admitto/shared
          -- --reporter=default --reporter=junit --outputFile.junit=./junit.xml
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: rest
          files: |
            packages/**/coverage/lcov.info
            packages/**/coverage-integration/lcov.info
            apps/**/coverage/lcov.info
            apps/**/coverage-integration/lcov.info
          fail_ci_if_error: false
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3  # v1.2.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: rest
          fail_ci_if_error: false

  # main's branch protection requires a status check literally named "build-test" - this
  # aggregator keeps that name alive (and its pass/fail contract equivalent to the old monolithic
  # job) without needing anyone to update the protection rule's required-checks list. Update this
  # `needs:` list, not the branch protection settings, if the shard jobs above are ever renamed.
  #
  # if: always() + an explicit result check, not the needs: default - by default a job whose
  # needs: includes a failed job is skipped, not failed, and this aggregator is the one thing
  # standing between a shard's real outcome and the required check GitHub actually gates merges
  # on. Relying on "skipped never satisfies a required check" is the kind of implicit contract
  # worth not staking a branch-protection guarantee on when an explicit, always-run check is this
  # cheap (CodeRabbit review).
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [lint-and-typecheck, test-web, test-admin, test-rest]
    if: always()
    steps:
      - name: Check all shards succeeded
        run: |
          for result in \
            "${{ needs.lint-and-typecheck.result }}" \
            "${{ needs.test-web.result }}" \
            "${{ needs.test-admin.result }}" \
            "${{ needs.test-rest.result }}"; do
            if [ "$result" != "success" ]; then
              echo "At least one build-test shard did not succeed."
              exit 1
            fi
          done
          echo "All build-test shards passed."

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          curl -sSfL --proto '=https' --proto-redir '=https' -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          echo "ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          # gitleaks' default log-opts is `git log --all --full-history` - with fetch-depth:0
          # above fetching every remote branch, that scans every open branch's commits, not just
          # this ref's own. Any PR then fails secret-scan if ANY other branch in the repo has a
          # commit gitleaks flags, regardless of that PR's actual changes. Scope the scan to just
          # this ref's own commits instead: the PR's commits since its base, or the commits a push
          # actually introduced.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            RANGE="origin/$BASE_REF..HEAD"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            RANGE="$BEFORE_SHA..$HEAD_SHA"
          else
            RANGE="-1"
          fi
          ./gitleaks detect --source . --no-banner --redact --exit-code 1 --log-opts="$RANGE"

  pii-guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: No real email addresses in tracked data files
        run: |
          # -z / xargs -0: handle filenames with spaces correctly
          # domain anchor ($): prevent @example.com.evil bypass
          # package-lock.json may contain maintainer emails in npm deprecation metadata — not our data.
          HITS=$(git ls-files -z -- '*.csv' '*.tsv' '*.json' ':!package-lock.json' \
            | xargs -0 grep -hREo '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' -- \
            | grep -viE '@(example\.(com|org|net)|test\.(com|org|net))$' || true)
          if [ -n "$HITS" ]; then
            echo "Suspicious real email addresses found in data files:"
            echo "$HITS"
            exit 1
          fi
          echo "OK: no real email addresses in data files"

  migration-safety:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: PR destructive override label
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh pr view "${{ github.event.pull_request.number }}" \
            --json labels -q '.labels[].name' \
            | grep -qx 'migration-destructive-approved'; then
            echo "MIGRATION_DESTRUCTIVE_LABEL_APPROVED=1" >> "$GITHUB_ENV"
          fi
      - name: Scan new migrations for destructive SQL
        run: bash scripts/check-migrations-destructive.sh
      - name: Migration guard unit tests
        run: bash scripts/check-migrations-destructive.test.sh
      - name: Migrate entrypoint smoke (docker compose)
        run: bash scripts/test-migrate-entrypoint.sh

  docker-build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [build-test, migration-safety]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Build production image
        run: docker build -f Dockerfile -t admitto-app .
