name: Release

# After a `release: vX.Y.Z` commit on main bumps package.json, create the git tag and GitHub
# Release (notes + required .title tagline), then close the milestone. publish-container.yml and
# deploy-smoke.yml are NOT dispatched from here - their own `push: tags:` triggers fire on the tag
# push below on their own, because that push is made with a GitHub App installation token, not
# GITHUB_TOKEN (see the "Mint release automation token" step's own comment for why that matters).
#
# The release commit isn't always HEAD: a "Create a merge commit" merge of the release
# PR puts it one or more commits behind the merge commit that actually triggers this push
# event (only a squash merge lands it at HEAD directly). Detection below checks every
# commit this specific push introduced (via the compare API, not just HEAD's own subject),
# so it fires the same way regardless of which merge method was used to land the release
# PR. It does NOT gate on whether the GitHub Release already exists — that would make a
# rerun after a partial failure (e.g. release created but the container-publish trigger or
# milestone close failed) skip the remaining steps too. Each downstream step stays
# responsible for its own idempotency instead.

on:
  push:
    branches: [main]

permissions:
  contents: read
  # `gh api -X PATCH .../milestones/${MID} -f state=closed` below - closing a milestone is gated
  # on the issues scope, no narrower alternative exists. Not exempted by Scorecard's
  # Token-Permissions check either, but "issues" isn't in that check's list of permissions it
  # flags at all (checks/raw/permissions.go's permissionsOfInterest), so this one was never the
  # problem.
  issues: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Detect product version bump
        id: bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NEW="$(jq -r .version package.json)"
          if ! printf '%s' "$NEW" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid package.json version: $NEW" >&2
            exit 1
          fi
          TAG="v${NEW}"
          TAG_RE="v${NEW//./\\.}"

          BEFORE='${{ github.event.before }}'
          AFTER='${{ github.sha }}'
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            MESSAGES="$(git log -1 --format=%s "$AFTER")"
          else
            MESSAGES="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BEFORE}...${AFTER}" --jq '.commits[].commit.message')"
          fi

          # GitHub adds " (#<PR>)" to a squash- or merge-commit subject. Accept that
          # standard suffix while still requiring this exact product version.
          if ! printf '%s\n' "$MESSAGES" | grep -qiE "^release:[[:space:]]+${TAG_RE}([[:space:]]+\\(#[0-9]+\\))?\$"; then
            echo "This push didn't introduce a 'release: ${TAG}' commit — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "Product version bump detected: ${TAG}"

      - name: Verify release artifacts
        if: steps.bump.outputs.skip != 'true'
        run: |
          set -euo pipefail
          VERSION='${{ steps.bump.outputs.version }}'
          NOTES=".github/release-notes/v${VERSION}.md"
          TITLE=".github/release-notes/v${VERSION}.title"
          test -f "$NOTES"
          test -f "$TITLE"
          test -s "$TITLE"
          grep -q "## \\[${VERSION}\\]" CHANGELOG.md
          python3 scripts/sync-release-docs.py --check
          echo "Release artifacts OK for v${VERSION}"

      # Mints a short-lived installation token for the dedicated "admitto-release-automation"
      # GitHub App instead of using GITHUB_TOKEN for the contents:write (release/tag) operation
      # below - see this file's own git history for why contents:write was unavoidable on
      # GITHUB_TOKEN. The App holds only Contents:write on this one repo, so this job's own
      # GITHUB_TOKEN permissions above can stay read-only + the unrelated issues:write for
      # milestone closing. permission-contents pins the minted token to exactly that scope
      # regardless of what else the App's installation is ever granted, so a compromise of this
      # job can't also do whatever else the App holds. Gated on skip and placed here (not before
      # detection) so an ordinary non-release push to main never depends on the App secrets or
      # the token-minting service at all.
      #
      # Side effect this relies on, not just a permission swap: unlike GITHUB_TOKEN, a tag pushed
      # with a GitHub App token is NOT exempt from triggering other workflows' own `push:` events
      # (GitHub's anti-recursion suppression is specific to GITHUB_TOKEN). So creating the tag
      # below with this token is what makes publish-container.yml's and deploy-smoke.yml's own
      # `push: tags:` triggers fire for an ordinary release now - this workflow used to dispatch
      # both explicitly for exactly that reason, and must not also do so any more: a real bot
      # review on this repo's history caught that leaving both in place double-triggers each one
      # per release.
      - name: Mint release automation token
        id: app-token
        if: steps.bump.outputs.skip != 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Create GitHub Release and tag
        if: steps.bump.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          VERSION='${{ steps.bump.outputs.version }}'
          TAG="v${VERSION}"
          NOTES=".github/release-notes/v${VERSION}.md"
          DISPLAY_TITLE="$(bash scripts/release-display-title.sh "$VERSION")"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping create."
            exit 0
          fi

          gh release create "$TAG" \
            --title "$DISPLAY_TITLE" \
            --notes-file "$NOTES" \
            --latest
          echo "Created $TAG ($DISPLAY_TITLE)."

      - name: Close matching GitHub milestone
        if: steps.bump.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION='${{ steps.bump.outputs.version }}'
          TITLE="v${VERSION}"
          MID="$(gh api "repos/${GITHUB_REPOSITORY}/milestones" \
            --jq ".[] | select(.title == \"${TITLE}\" and .state == \"open\") | .number" \
            | head -n 1)"
          if [ -z "$MID" ]; then
            echo "No open milestone titled ${TITLE} — skipping."
            exit 0
          fi
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/milestones/${MID}" -f state=closed
          echo "Closed milestone ${TITLE} (#${MID})"
