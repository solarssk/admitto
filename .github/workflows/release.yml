name: Release

# After a `release: vX.Y.Z` commit on main bumps package.json, create the git tag,
# GitHub Release (notes + required .title tagline), close the milestone, and trigger
# publish-container.yml and deploy-smoke.yml (GITHUB_TOKEN tag pushes do not start other
# workflows, so each needs an explicit dispatch here rather than relying on its own tag trigger).
#
# The release commit isn't always HEAD: a "Create a merge commit" merge of the release
# PR puts it one or more commits behind the merge commit that actually triggers this push
# event (only a squash merge lands it at HEAD directly). Detection below checks every
# commit this specific push introduced (via the compare API, not just HEAD's own subject),
# so it fires the same way regardless of which merge method was used to land the release
# PR. It does NOT gate on whether the GitHub Release already exists — that would make a
# rerun after a partial failure (e.g. release created but the container-publish trigger or
# milestone close failed) skip the remaining steps too. Each downstream step stays
# responsible for its own idempotency instead.

on:
  push:
    branches: [main]

permissions:
  # `gh release create` below (Releases API) hard-requires this - no narrower alternative exists.
  contents: write
  # `gh api -X PATCH .../milestones/${MID} -f state=closed` below - closing a milestone is gated
  # on the issues scope, no narrower alternative exists.
  issues: write
  # `gh workflow run publish-container.yml` / `deploy-smoke.yml` below - confirmed required, not
  # a design oversight: GITHUB_TOKEN-created tag pushes deliberately do not cascade into other
  # workflow runs (GitHub's own anti-infinite-loop protection), so re-dispatching explicitly is
  # the only way to trigger them from here. A workflow_call alternative was raised twice in PR
  # review and this comment got the analysis wrong both times, so treat the question as still
  # open rather than settled: (1) the two trigger paths don't actually collide the way an even
  # earlier version of this comment claimed (an ordinary release never reaches
  # publish-container.yml's own `push: tags:`, since that's exactly the GITHUB_TOKEN limitation
  # above; the emergency signed-tag path never runs *this* workflow, since release.yml only
  # triggers on `push: branches: [main]`) - confirmed correct. (2) A follow-up claimed switching
  # to workflow_call would still cost more than it saves, since GitHub's reusable-workflow docs
  # say permissions "can only be maintained or reduced - not elevated" down the call chain, so
  # *this* workflow would need packages/id-token/attestations write too - also successfully
  # disputed: a *separate* caller job (not the one already holding contents/issues:write) could
  # hold just that ceiling, and publish-container.yml's own jobs already carry those exact scopes
  # today regardless of how they're triggered, so no *new* capability would exist anywhere that
  # doesn't already exist now. Whether that nets out better for Scorecard's own literal per-line
  # counting - which flags every job-level `write` grant as its own finding, so a second job in
  # this file carrying the union ceiling might just relocate the count rather than shrink it - is
  # genuinely unresolved: GitHub's own docs don't say whether a `uses:`-only job's `permissions:`
  # block registers as a "grant" the same way a job with real steps does. Left as `actions: write`
  # here pending either clearer documentation or an actual test against this repo's release
  # pipeline, which is too high-stakes to experiment on speculatively.
  actions: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Detect product version bump
        id: bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NEW="$(jq -r .version package.json)"
          if ! printf '%s' "$NEW" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid package.json version: $NEW" >&2
            exit 1
          fi
          TAG="v${NEW}"
          TAG_RE="v${NEW//./\\.}"

          BEFORE='${{ github.event.before }}'
          AFTER='${{ github.sha }}'
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            MESSAGES="$(git log -1 --format=%s "$AFTER")"
          else
            MESSAGES="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BEFORE}...${AFTER}" --jq '.commits[].commit.message')"
          fi

          # GitHub adds " (#<PR>)" to a squash- or merge-commit subject. Accept that
          # standard suffix while still requiring this exact product version.
          if ! printf '%s\n' "$MESSAGES" | grep -qiE "^release:[[:space:]]+${TAG_RE}([[:space:]]+\\(#[0-9]+\\))?\$"; then
            echo "This push didn't introduce a 'release: ${TAG}' commit — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "Product version bump detected: ${TAG}"

      - name: Verify release artifacts
        if: steps.bump.outputs.skip != 'true'
        run: |
          set -euo pipefail
          VERSION='${{ steps.bump.outputs.version }}'
          NOTES=".github/release-notes/v${VERSION}.md"
          TITLE=".github/release-notes/v${VERSION}.title"
          test -f "$NOTES"
          test -f "$TITLE"
          test -s "$TITLE"
          grep -q "## \\[${VERSION}\\]" CHANGELOG.md
          python3 scripts/sync-release-docs.py --check
          echo "Release artifacts OK for v${VERSION}"

      - name: Create GitHub Release and tag
        if: steps.bump.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION='${{ steps.bump.outputs.version }}'
          TAG="v${VERSION}"
          NOTES=".github/release-notes/v${VERSION}.md"
          DISPLAY_TITLE="$(bash scripts/release-display-title.sh "$VERSION")"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping create."
            exit 0
          fi

          gh release create "$TAG" \
            --title "$DISPLAY_TITLE" \
            --notes-file "$NOTES" \
            --latest
          echo "Created $TAG ($DISPLAY_TITLE)."

      - name: Trigger container publish
        if: steps.bump.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION='${{ steps.bump.outputs.version }}'
          TAG="v${VERSION}"
          gh workflow run publish-container.yml \
            --ref "$TAG" \
            -f "ref=refs/tags/${TAG}"
          echo "Triggered publish-container for ${TAG}."

      # deploy-smoke.yml's own `push: tags:` trigger never fires for this - GITHUB_TOKEN tag
      # pushes don't start other workflows (same reason publish-container above needs a manual
      # dispatch), so without this call every ordinary release would ship with no automated
      # functional smoke test, silently. That push trigger stays useful only for the emergency
      # signed-tag path (scripts/release-tag.sh), which pushes with a real user's credentials.
      - name: Trigger deploy smoke test
        if: steps.bump.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION='${{ steps.bump.outputs.version }}'
          TAG="v${VERSION}"
          gh workflow run deploy-smoke.yml --ref "$TAG"
          echo "Triggered deploy-smoke for ${TAG}."

      - name: Close matching GitHub milestone
        if: steps.bump.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION='${{ steps.bump.outputs.version }}'
          TITLE="v${VERSION}"
          MID="$(gh api "repos/${GITHUB_REPOSITORY}/milestones" \
            --jq ".[] | select(.title == \"${TITLE}\" and .state == \"open\") | .number" \
            | head -n 1)"
          if [ -z "$MID" ]; then
            echo "No open milestone titled ${TITLE} — skipping."
            exit 0
          fi
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/milestones/${MID}" -f state=closed
          echo "Closed milestone ${TITLE} (#${MID})"
