name: Deploy smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare deploy env
        working-directory: deploy
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=smoke-test-secret/' .env
          sed -i 's|^DATABASE_URL=.*|DATABASE_URL=postgresql://admitto_app:smoke-test-secret@db:5432/admitto|' .env
          ENCRYPTION_KEY=$(openssl rand -base64 32)
          node -e "if (Buffer.from(process.argv[1], 'base64').length !== 32) { console.error('ENCRYPTION_KEY must decode to 32 bytes'); process.exit(1); }" "$ENCRYPTION_KEY"
          sed -i "s|^ENCRYPTION_KEY=.*|ENCRYPTION_KEY=${ENCRYPTION_KEY}|" .env
          sed -i 's|^BASE_URL=.*|BASE_URL=http://127.0.0.1:8080|' .env
          sed -i 's/^REDIS_PASSWORD=.*/REDIS_PASSWORD=smoke-redis-secret/' .env
          sed -i 's|^REDIS_URL=.*|REDIS_URL=redis://:smoke-redis-secret@redis:6379|' .env
          node validate-env.mjs .env

      - name: Build and start stack
        working-directory: deploy
        run: docker compose up -d --build

      - name: Wait for healthy proxy
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080/healthz >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "healthz never became ready"
          docker compose -f deploy/docker-compose.yml logs
          exit 1

      - name: Smoke checks
        run: |
          curl -sf http://127.0.0.1:8080/healthz | grep -q '"status":"ok"'
          curl -sf http://127.0.0.1:8080/login -o /dev/null -w '%{http_code}\n' | grep -q 200
          login_code=$(curl -s -o /tmp/login-post-body -w '%{http_code}' -X POST http://127.0.0.1:8080/login \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            -H 'Origin: http://127.0.0.1:8080' \
            -d 'email=smoke@example.com&password=wrong')
          if [ "$login_code" = "403" ]; then
            echo "POST /login blocked by CSRF (403) — check proxy X-Forwarded-Host"
            cat /tmp/login-post-body
            exit 1
          fi
          if [ "$login_code" != "401" ]; then
            echo "POST /login expected 401 invalid credentials, got $login_code"
            cat /tmp/login-post-body
            exit 1
          fi
          grep -q 'Invalid email or password' /tmp/login-post-body
          if curl --connect-timeout 2 -sf http://127.0.0.1:3000/healthz >/dev/null 2>&1; then
            echo "app port 3000 must not be published on host"
            exit 1
          fi

      - name: Verify import package in image
        working-directory: deploy
        run: |
          docker compose run --rm app node --input-type=module -e "import('@admitto/import').then(() => console.log('ok'))"

      - name: Tear down
        if: always()
        working-directory: deploy
        run: docker compose down -v
