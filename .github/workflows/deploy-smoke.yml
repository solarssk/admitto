name: Deploy smoke

# The release gate in publish-container.yml smoke-tests both platform digests before tagging.
# This independent run verifies that the final multi-arch release tag can also be pulled.
on:
  workflow_dispatch:
    inputs:
      image_ref:
        description: Published ghcr.io/solarssk/admitto image reference to test
        required: false
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: deploy-smoke-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  deploy-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve published image
        env:
          DISPATCH_IMAGE: ${{ inputs.image_ref }}
        run: |
          if [ "${{ github.event_name }}" = 'workflow_dispatch' ]; then
            [ -n "$DISPATCH_IMAGE" ] || { echo 'image_ref is required for manual runs' >&2; exit 1; }
            echo "ADMITTO_IMAGE=$DISPATCH_IMAGE" >> "$GITHUB_ENV"
          else
            echo "ADMITTO_IMAGE=ghcr.io/${{ github.repository }}:${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi

      # The tag event also starts Publish container. Wait until it has promoted the tested
      # candidate digests to a version tag; if publication fails, this job fails closed.
      - name: Wait for published image
        if: github.event_name == 'push'
        run: |
          for attempt in $(seq 1 120); do
            if docker manifest inspect "$ADMITTO_IMAGE" >/dev/null 2>&1; then
              exit 0
            fi
            echo "Release image not published yet (${attempt}/120)."
            sleep 15
          done
          echo "Timed out waiting for $ADMITTO_IMAGE" >&2
          exit 1

      - name: Smoke-test published image
        run: bash deploy/scripts/smoke-image.sh
