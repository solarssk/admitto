name: AI review

# Automated review, with explicit policy approvals when Claude is unavailable, so a single-maintainer
# repo has a reviewer other than the PR author. It only ever reviews: it approves or comments, it
# never merges, never pushes, and never changes labels. The maintainer keeps the final say and
# merges by hand; the required status checks and branch protection still apply on top.
#
# pull_request_target (not pull_request): the workflow definition used for a run always comes from
# the base branch, so a PR cannot edit this file to approve itself. Nothing from the PR is checked
# out or executed: Claude reads only the PR's diff, copied into a plain text file, plus the base
# branch. The diff is treated as untrusted data (see the prompt), the session is confined to the
# read-only tools Read, Grep and Glob inside the checkout (see the flags of the model step) and the
# verdict is a fixed JSON schema, so injected text in a diff has no tool to act with and nothing
# outside the checkout to read. The review text is still scanned for credential-shaped strings before
# it is posted, because this repository is public and the model's process holds the Claude
# subscription credential and the job token.
#
# Automatic scope: same-repository PRs opened by the repository owner. The owner can also
# dispatch a review of a same-repository Dependabot PR from the default branch. Forks remain
# excluded, and the target is validated through the API before any provider credential is used.
#
# A new push dismisses the approval (branch protection: dismiss stale reviews). Owner PRs run
# again automatically; Dependabot PRs need a new manual dispatch for the updated commit.

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Open pull request to review (owner or Dependabot, same repository)"
        required: true
        type: string
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ai-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

permissions: {}

jobs:
  review:
    name: AI review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      ${{
        (github.event_name == 'pull_request_target' &&
          !github.event.pull_request.draft &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.login == github.repository_owner) ||
        (github.event_name == 'workflow_dispatch' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
      }}
    permissions:
      contents: read # checkout of the BASE branch and reading it
      pull-requests: write # submit the review
      actions: read # count today's runs for the daily review budget
    env:
      # Spend guards. The reviewer runs on the maintainer's Claude subscription, whose limit is
      # shared with their own work, so a burst of pushes must not be able to drain it. A manual
      # re-run of the job (attempt 2 or later) skips the check on purpose.
      # Raised on 2026-10-10: at 6 and 80 a busy stack of PRs used them up within hours (24 runs on
      # one PR, 82 in a day) and every later push got a policy approval with no review. The
      # check stays as a runaway-loop guard only. The count reads at most 200 runs, so the daily
      # limit above 200 can never trigger.
      PER_PR_LIMIT: 100 # review attempts on one PR before it stops reviewing new pushes
      DAILY_LIMIT: 1000 # review attempts per UTC day, across all PRs
      # Seconds a run waits for further pushes before it does anything else. The budget count reads
      # the same number: a run cancelled after this wait may already be in the reviewer.
      DEBOUNCE_SECONDS: 60

    steps:
      - name: Resolve review target
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_PR: ${{ github.event.pull_request.number || inputs.pr_number }}
          EVENT_NAME: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          OWNER_ID: ${{ github.event.repository.owner.id }}
          ACTOR_ID: ${{ github.actor_id }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [[ "$ACTOR_ID" != "$OWNER_ID" ]]; then exit 1; fi
            if ! [[ "$TRIGGERING_ACTOR" =~ ^[A-Za-z0-9-]+$ ]]; then exit 1; fi
            if [[ "$(gh api "users/${TRIGGERING_ACTOR}" --jq .id)" != "$OWNER_ID" ]]; then exit 1; fi
          fi
          [[ "$REQUESTED_PR" =~ ^[1-9][0-9]*$ ]]
          TARGET="$RUNNER_TEMP/ai-review-target.json"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${REQUESTED_PR}" > "$TARGET"
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg owner "$GITHUB_REPOSITORY_OWNER" \
            --arg number "$REQUESTED_PR" --arg event "$EVENT_NAME" --arg branch "$DEFAULT_BRANCH" '
              .state == "open" and .draft == false and .number == ($number | tonumber) and
              .head.repo.full_name == $repo and .base.repo.full_name == $repo and
              (.user.login == $owner or ($event == "workflow_dispatch" and .user.login == "dependabot[bot]")) and
              ($event != "workflow_dispatch" or .base.ref == $branch) and
              (.head.sha | test("^[a-f0-9]{40}$")) and
              (.base.sha | test("^[a-f0-9]{40}$"))
            ' "$TARGET" > /dev/null
          jq -r '"pr_number=\(.number)\nhead_sha=\(.head.sha)\nhead_ref=\(.head.ref)\nbase_sha=\(.base.sha)\nbase_ref=\(.base.ref)"' "$TARGET" >> "$GITHUB_OUTPUT"

      # Debounce: a newer push cancels this run (concurrency above) while it is still waiting, so
      # a quick series of pushes costs one review, not one per push. Runner minutes are free on a
      # public repo; the model tokens are what this saves. Skipped on a manual re-run (attempt 2
      # or later): nobody is pushing then, the maintainer is waiting for the result.
      - name: Wait for further pushes
        if: ${{ github.run_attempt == 1 }}
        run: sleep "$DEBOUNCE_SECONDS"

      # Read the validated base commit, including on reruns after the base branch advances.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ steps.target.outputs.base_sha }}
          persist-credentials: false

      # Built from the per-file API instead of `gh pr diff` so lockfiles (large, machine-written, and
      # covered by dependency-review and Snyk) never reach the model. Only lockfiles are excluded,
      # matched by exact file name: an exclusion by directory or extension (dist/, *.min.js, ...)
      # would let a PR hide any file from the reviewer by choosing its path. Excluded files are
      # named at the top of the diff file, so the omission is visible.
      - name: Fetch the PR diff
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
        run: |
          set -euo pipefail
          mkdir -p .ai-review
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --jq '.[]' | jq -s '.' > .ai-review/files.json
          # A change is documentation-only when every file it touches (including the old name of a
          # renamed file) is a Markdown file under docs/ or CHANGELOG.md. AGENTS.md and CLAUDE.md
          # are excluded wherever they sit: they steer agents, so they are code, not documentation.
          # Anything else, including .github/, makes it an ordinary change that gets a model review.
          DOCS_ONLY=$(jq -r 'def ok: test("^(docs/.*\\.md|CHANGELOG\\.md)$") and (test("(^|/)(AGENTS|CLAUDE)\\.md$") | not);
            length > 0 and all(.[]; (.filename | ok) and ((.previous_filename // .filename) | ok))' .ai-review/files.json)
          echo "docs_only=${DOCS_ONLY}" >> "$GITHUB_OUTPUT"
          jq -r -f .github/ai-review/build-diff.jq .ai-review/files.json > .ai-review/pr.diff
          # The description as it is now, not as it was when the event fired, so an edit followed by
          # a re-run is seen. Capped: it is context, not review input.
          gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json body --jq '.body // ""' > .ai-review/pr-notes.full
          head -c 4000 .ai-review/pr-notes.full > .ai-review/pr-notes.md
          BYTES=$(wc -c < .ai-review/pr.diff)
          echo "Diff is ${BYTES} bytes"
          if [ "$BYTES" -gt 400000 ]; then
            echo "too_large=true" >> "$GITHUB_OUTPUT"
          fi
          if grep -q '^UNAVAILABLE:' .ai-review/pr.diff; then
            echo "unavailable=true" >> "$GITHUB_OUTPUT"
          fi

      # Counts every run that could have cost model tokens, whatever its outcome (the rules live in
      # .github/ai-review/count-attempts.jq and are unit tested): failed, timed out and successful
      # runs count, and so does a run cancelled by a newer push once it had lived past the debounce
      # wait (it may already have started the reviewer). Runs still in progress or queued count too, which narrows, but cannot remove, the
      # window in which two PRs check the budget at the same moment; the daily limit is therefore
      # a close bound, not an exact one.
      - name: Check the review budget
        id: budget
        if: ${{ github.run_attempt == 1 && steps.diff.outputs.docs_only != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          # Manual reviews share the default branch's attempt budget; the daily limit also applies.
          HEAD_REF: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || steps.target.outputs.head_ref }}
        run: |
          set -euo pipefail
          FIELDS=databaseId,status,conclusion,createdAt,startedAt,updatedAt
          PR_RUNS=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ai-review.yml --branch "$HEAD_REF" \
            --limit 200 --json "$FIELDS" | jq --argjson self "$RUN_ID" --argjson settle "$DEBOUNCE_SECONDS" -f .github/ai-review/count-attempts.jq)
          TODAY=$(date -u +%Y-%m-%d)
          DAY_RUNS=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ai-review.yml --created ">=${TODAY}" \
            --limit 200 --json "$FIELDS" | jq --argjson self "$RUN_ID" --argjson settle "$DEBOUNCE_SECONDS" -f .github/ai-review/count-attempts.jq)
          echo "Runs on this PR: ${PR_RUNS}/${PER_PR_LIMIT}; runs today: ${DAY_RUNS}/${DAILY_LIMIT}"
          echo "pr_runs=${PR_RUNS}" >> "$GITHUB_OUTPUT"
          echo "day_runs=${DAY_RUNS}" >> "$GITHUB_OUTPUT"
          if [ "$PR_RUNS" -ge "$PER_PR_LIMIT" ]; then
            echo "exhausted=true" >> "$GITHUB_OUTPUT"
            echo "reason=this PR has used its ${PER_PR_LIMIT} automated review attempts" >> "$GITHUB_OUTPUT"
          elif [ "$DAY_RUNS" -ge "$DAILY_LIMIT" ]; then
            echo "exhausted=true" >> "$GITHUB_OUTPUT"
            echo "reason=the daily budget of ${DAILY_LIMIT} automated review attempts is used up" >> "$GITHUB_OUTPUT"
          fi

      # The reviewer's prompt and output schema are files in the BASE branch checkout (never the PR's),
      # the same files the "AI review backtest" workflow measures, so a backtest of the `live` variant
      # is a test of exactly what runs here. A test (scripts/ai-review-single-source.test.mjs) keeps
      # this workflow from growing an inline copy again.
      - name: Load the reviewer prompt and schema
        id: reviewer
        if: steps.diff.outputs.too_large != 'true' && steps.diff.outputs.docs_only != 'true' && steps.budget.outputs.exhausted != 'true'
        run: |
          set -euo pipefail
          DELIM="EOF_$(openssl rand -hex 8)"
          {
            echo "prompt<<${DELIM}"
            cat .github/ai-review/prompt-live.md
            echo
            echo "${DELIM}"
            echo "schema=$(jq -c . .github/ai-review/schema-live.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Check the Claude credential
        id: claude_credential
        if: steps.diff.outputs.too_large != 'true' && steps.diff.outputs.docs_only != 'true' && steps.budget.outputs.exhausted != 'true'
        env:
          CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$CLAUDE_TOKEN" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      # One status comment on the pull request, edited in place (scripts/ai-review-status.mjs): this
      # first version says which commit is being reviewed, the last one says what happened. It never
      # decides a verdict or an exit code.
      - name: Report that the review started
        id: started
        if: steps.claude_credential.outputs.present == 'true'
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
          HEAD_SHA: ${{ steps.target.outputs.head_sha }}
          BASE_SHA: ${{ steps.target.outputs.base_sha }}
          BASE_REF: ${{ steps.target.outputs.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
          PR_RUNS: ${{ steps.budget.outputs.pr_runs }}
          DAY_RUNS: ${{ steps.budget.outputs.day_runs }}
          REVIEW_TIMEOUT_MINUTES: 15
        run: node scripts/ai-review-status.mjs start

      - name: Review the diff
        id: review
        if: steps.claude_credential.outputs.present == 'true'
        # Inspect the CLI result before deciding whether an action failure is a provider outage.
        continue-on-error: true
        # A hung reviewer is stopped here, not by the 30 minute job limit, so the run can still say
        # what happened. REVIEW_TIMEOUT_MINUTES in the two status steps must be this number.
        timeout-minutes: 15
        uses: anthropics/claude-code-action@97c53473391bff1901034d4b454b5bac7ab7a029  # v1.0.239
        with:
          # The maintainer's Claude subscription (from `claude setup-token`), not per-token API billing.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.reviewer.outputs.prompt }}
          # The session is confined to reading the checkout. --tools removes every other built-in tool (a
          # subagent, a shell, file writes, web access). --allowedTools pre-approves reads inside the
          # checkout only and --permission-mode dontAsk refuses everything else, so a read outside it (the
          # process environment, the runner's files) is denied, not asked about. --disallowedTools "mcp__*"
          # and --strict-mcp-config leave no MCP tool, whatever the action or the repository would add.
          # --allowedTools alone would pre-approve and restrict nothing. Verified against the CLI build the
          # pinned action bundles (docs/dev/ai-review-lessons.md, lesson 7); check again when the action is
          # bumped. The status comment warns if the execution log shows the session was set up differently.
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 20
            --tools "Read,Grep,Glob"
            --permission-mode dontAsk
            --allowedTools "Read(./**)"
            --disallowedTools "mcp__*"
            --strict-mcp-config
            --json-schema '${{ steps.reviewer.outputs.schema }}'

      - name: Classify Claude outcome
        id: claude_status
        if: ${{ !cancelled() && steps.claude_credential.outputs.present != '' }}
        env:
          CLAUDE_OUTCOME: ${{ steps.review.outcome }}
          CLAUDE_CREDENTIAL_PRESENT: ${{ steps.claude_credential.outputs.present }}
          CLAUDE_STRUCTURED: ${{ steps.review.outputs.structured_output }}
          CLAUDE_EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
        run: node scripts/ai-review-outcome.mjs

      - name: Request Codex subscription fallback
        id: codex
        if: >-
          ${{ !cancelled() && steps.claude_status.outputs.status == 'unavailable' &&
              steps.diff.outputs.unavailable != 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_REVIEW_TRIGGER_TOKEN: ${{ secrets.CODEX_REVIEW_TRIGGER_TOKEN }}
          ALLOW_DEPENDABOT: ${{ github.event_name == 'workflow_dispatch' }}
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
          HEAD_SHA: ${{ steps.target.outputs.head_sha }}
        run: node scripts/ai-review-codex.mjs

      - name: Report review cost
        if: ${{ !cancelled() && steps.review.outputs.execution_file != '' }}
        env:
          EXEC_FILE: ${{ steps.review.outputs.execution_file }}
        run: |
          jq -r '[.. | objects | select(.type == "result")] | last | "AI review cost: \(.total_cost_usd // "n/a") USD, \(.num_turns // "n/a") turns"' "$EXEC_FILE" >> "$GITHUB_STEP_SUMMARY" || true

      # Not always(): a run cancelled by a newer push must not go on to dismiss or post anything.
      - name: Submit the review
        if: ${{ !cancelled() && steps.target.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
          HEAD_SHA: ${{ steps.target.outputs.head_sha }}
          BASE_SHA: ${{ steps.target.outputs.base_sha }}
          BASE_REF: ${{ steps.target.outputs.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TOO_LARGE: ${{ steps.diff.outputs.too_large }}
          UNAVAILABLE: ${{ steps.diff.outputs.unavailable }}
          DOCS_ONLY: ${{ steps.diff.outputs.docs_only }}
          BUDGET_EXHAUSTED: ${{ steps.budget.outputs.exhausted }}
          BUDGET_REASON: ${{ steps.budget.outputs.reason }}
          CLAUDE_STATUS: ${{ steps.claude_status.outputs.status }}
          CLAUDE_REASON: ${{ steps.claude_status.outputs.reason }}
          CODEX_STATUS: ${{ steps.codex.outputs.status }}
          CODEX_REASON: ${{ steps.codex.outputs.reason }}
          CODEX_RESULT_ID: ${{ steps.codex.outputs.resultId }}
          CODEX_RESULT_KIND: ${{ steps.codex.outputs.resultKind }}
          CODEX_OUTCOME: ${{ steps.codex.outcome }}
          STRUCTURED: ${{ steps.review.outputs.structured_output }}
          PR_RUNS: ${{ steps.budget.outputs.pr_runs }}
          DAY_RUNS: ${{ steps.budget.outputs.day_runs }}
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
          REVIEW_STARTED: ${{ steps.started.outputs.started }}
          REVIEW_TIMEOUT_MINUTES: 15
          CLAUDE_EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
        run: |
          set -euo pipefail
          BODY="$RUNNER_TEMP/review.md"

          # The readable report on the pull request (scripts/ai-review-status.mjs). Best effort: it
          # never changes the verdict or the exit code, and every way out of this step goes through
          # it once. A way out that does not (a failed GitHub call under set -e) is caught by the trap.
          # An exit caused by a signal (status above 128) is a cancelled run, not a failure to report:
          # whoever cancelled it, a newer push or a command, writes the status that fits.
          STATUS_DONE=""
          publish_status() {
            STATUS_DONE=1
            STATUS_STATE="$1" STATUS_DETAIL="${2:-}" node scripts/ai-review-status.mjs final \
              || echo "The AI review status comment could not be updated."
          }
          trap 'rc=$?; [ "$rc" -eq 0 ] || [ "$rc" -gt 128 ] || [ -n "$STATUS_DONE" ] || publish_status failed publication_error' EXIT
          STATE=""
          DETAIL=""

          # Dismiss this bot's approvals of the reviewed commit. Every path that does not end in a
          # fresh approval goes through here first, including the ones that then fail the job, so
          # an approval from an earlier run on the same commit can never outlive a failed re-review.
          dismiss_bot_approvals() {
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" --paginate \
              --jq ".[] | select(.user.login == \"github-actions[bot]\" and .state == \"APPROVED\" and .commit_id == \"${HEAD_SHA}\") | .id" |
              while read -r RID; do
                gh api -X PUT "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews/${RID}/dismissals" \
                  -f message="AI review no longer approves this commit." -f event=DISMISS >/dev/null
              done
          }

          # Recheck eligibility and the complete reviewed diff before any publication.
          current_review_target() {
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" |
              jq -e --arg repo "$GITHUB_REPOSITORY" --arg owner "$GITHUB_REPOSITORY_OWNER" \
                --arg head "$HEAD_SHA" --arg base "$BASE_SHA" --arg ref "$BASE_REF" \
                --arg event "$EVENT_NAME" --arg branch "$DEFAULT_BRANCH" '
                  .state == "open" and .draft == false and
                  .head.repo.full_name == $repo and .base.repo.full_name == $repo and
                  (.user.login == $owner or ($event == "workflow_dispatch" and .user.login == "dependabot[bot]")) and
                  .head.sha == $head and .base.sha == $base and .base.ref == $ref and
                  ($event != "workflow_dispatch" or .base.ref == $branch)
                ' > /dev/null
          }
          if ! current_review_target; then
            echo "PR eligibility or reviewed diff changed - submitting nothing."
            publish_status stale
            exit 0
          fi

          if [ "${TOO_LARGE:-}" = "true" ]; then
            STATE=too-large
            printf '%s\n' '**AI review skipped:** the diff is larger than the automated reviewer accepts. It is not approved; review it by hand.' > "$BODY"
            APPROVE=false
          elif [ "${BUDGET_EXHAUSTED:-}" = "true" ]; then
            STATE=budget
            DETAIL="$BUDGET_REASON"
            printf '**Conditional approval by maintainer policy — no AI code review ran.** The automated review budget was exhausted (%s). This APPROVE satisfies the review gate only; it does not confirm code correctness. The maintainer must review the diff manually before merging. Required checks still apply. Re-run the job to request an AI review.\n' "$BUDGET_REASON" > "$BODY"
            APPROVE=true
          elif [ "${DOCS_ONLY:-}" = "true" ]; then
            STATE=docs-only
            printf '%s\n' '**Approved by a path rule, not by a model review.** Every file in this change is documentation (Markdown under docs/ or CHANGELOG.md), so no AI review was run. The required checks still apply, and the maintainer merges.' > "$BODY"
            APPROVE=true
          elif [ "${CLAUDE_STATUS:-}" = "unavailable" ] && \
               { [ "${CODEX_STATUS:-}" = "error" ] || [ "${CODEX_OUTCOME:-}" = "failure" ]; }; then
            echo "Codex fallback setup or GitHub API failed."
            dismiss_bot_approvals
            publish_status codex-error
            exit 1
          elif [ "${CLAUDE_STATUS:-}" = "unavailable" ] && \
               { [ "${CODEX_STATUS:-}" = "clean" ] || [ "${CODEX_STATUS:-}" = "findings" ]; }; then
            [[ "$CODEX_RESULT_ID" =~ ^[0-9]+$ ]]
            if [ "$CODEX_RESULT_KIND" = "review" ]; then
              RESULT_ANCHOR="pullrequestreview-${CODEX_RESULT_ID}"
            else
              RESULT_ANCHOR="issuecomment-${CODEX_RESULT_ID}"
            fi
            RESULT_URL="https://github.com/${GITHUB_REPOSITORY}/pull/${PR_NUMBER}#${RESULT_ANCHOR}"
            echo "AI reviewer provider: Codex subscription" >> "$GITHUB_STEP_SUMMARY"
            if [ "$CODEX_STATUS" = "clean" ]; then
              STATE=codex-clean
              printf '**AI review — Codex subscription fallback.** Claude was unavailable. The official Codex connector reported no major issues for this commit: %s. This approval is submitted by github-actions[bot]; the maintainer merges and required checks still apply.\n' "$RESULT_URL" > "$BODY"
              APPROVE=true
            else
              STATE=codex-findings
              printf '**AI review — Codex subscription fallback.** Claude was unavailable. Codex reported findings for this commit: %s. Nothing is approved; address the findings before merging.\n' "$RESULT_URL" > "$BODY"
              APPROVE=false
            fi
          elif [ "${CLAUDE_STATUS:-}" = "unavailable" ]; then
            echo "Claude unavailable: ${CLAUDE_REASON}. No review was produced."
            echo "AI reviewer provider: none" >> "$GITHUB_STEP_SUMMARY"
            STATE=no-provider
            printf '**Conditional approval by maintainer policy — no AI code review completed.** Claude was unavailable (%s); Codex fallback did not return a usable result (%s). This APPROVE satisfies the review gate only; it does not confirm code correctness. The maintainer must review the diff manually before merging. Required checks still apply.\n' "$CLAUDE_REASON" "${CODEX_REASON:-not_run}" > "$BODY"
            APPROVE=true
          elif [ "${CLAUDE_STATUS:-}" != "reviewed" ]; then
            echo "AI review failed: Claude did not produce a usable review and no provider outage was confirmed."
            dismiss_bot_approvals
            publish_status failed "${CLAUDE_REASON:-unknown}"
            exit 1
          else
            echo "AI reviewer provider: Claude" >> "$GITHUB_STEP_SUMMARY"
            {
              echo "**AI review** of \`${HEAD_SHA:0:7}\` (automated, second identity; the maintainer merges). Model, coverage and run details are in the AI review status comment."
              echo
              jq -r '.summary' <<< "$STRUCTURED"
              if [ "$(jq '.blocking_findings | length' <<< "$STRUCTURED")" -gt 0 ]; then
                echo
                echo "**Blocking findings**"
                jq -r '.blocking_findings[] | "- `\(.file)`: \(.issue)"' <<< "$STRUCTURED"
              fi
            } > "$BODY.full"
            # head after the group is written, not piped: a pipe into head would SIGPIPE the group
            # under pipefail as soon as the text passes the cap.
            head -c 8000 "$BODY.full" > "$BODY"
            if [ "$(jq -r '.verdict' <<< "$STRUCTURED")" = "approve" ] && \
               [ "$(jq '.blocking_findings | length' <<< "$STRUCTURED")" -eq 0 ]; then
              APPROVE=true
              STATE=approved
            else
              APPROVE=false
              STATE=findings
            fi
          fi

          # A file the reviewer could not see is never approved, whatever the model said.
          if [ "${UNAVAILABLE:-}" = "true" ]; then
            APPROVE=false
            STATE=unreadable
            printf '%s\n' '**No approval:** at least one changed file has no readable diff. The maintainer must review it manually.' > "$BODY"
          fi

          # Fail closed: this is a public repo and the reviewer process holds a credential, so a
          # review text that looks like it carries a credential is never posted.
          if grep -Eq 'sk-ant-|gh[pousr]_[A-Za-z0-9]{20,}|github_pat_|-----BEGIN' "$BODY"; then
            echo "Review text looks like it contains a credential - not posting."
            dismiss_bot_approvals
            publish_status withheld
            exit 1
          fi

          # A push, retarget or eligibility change makes this review stale.
          if ! current_review_target; then
            echo "PR eligibility or reviewed diff changed - submitting nothing."
            publish_status stale
            exit 0
          fi

          # The review is always bound to the reviewed commit (commit_id), never to "latest".
          if [ "$APPROVE" != "true" ]; then
            dismiss_bot_approvals
            EVENT=COMMENT
          else
            EVENT=APPROVE
          fi
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" \
            -f commit_id="$HEAD_SHA" -f event="$EVENT" -F body=@"$BODY" >/dev/null
          publish_status "$STATE" "$DETAIL"
