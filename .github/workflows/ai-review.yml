name: AI review

# A real, automated code review by a second identity (github-actions[bot]), so a single-maintainer
# repo has a reviewer other than the PR author. It only ever reviews: it approves or comments, it
# never merges, never pushes, and never changes labels. The maintainer keeps the final say and
# merges by hand; the required status checks and branch protection still apply on top.
#
# pull_request_target (not pull_request): the workflow definition used for a run always comes from
# the base branch, so a PR cannot edit this file to approve itself. Nothing from the PR is checked
# out or executed: Claude reads only the PR's diff, copied into a plain text file, plus the base
# branch. The diff is treated as untrusted data (see the prompt), the tools are read-only, and the
# verdict is a fixed JSON schema, so injected text in a diff cannot do more than skew the verdict.
# The review text is also scanned for credential-shaped strings before it is posted, because this
# repository is public and the model's process holds the API key.
#
# Reviewer order: Claude (the maintainer's subscription) is the only reviewer unless it cannot
# produce a review at all (login rejected, usage limit, outage); then Codex (the maintainer's
# ChatGPT subscription) reviews the same diff with the same prompt and schema, and the one Submit
# step below publishes whichever review exists. A review that found problems is a result, never a
# reason to fall back. See docs/dev/ai-review.md.
#
# Scope: same-repository PRs opened by the repository owner. Dependabot PRs and forks get no
# secrets here and are skipped; they stay unreviewed by this bot on purpose.
#
# A new push dismisses the approval (branch protection: dismiss stale reviews), and this workflow
# runs again on every push, so the approval always refers to the code that would be merged.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  review:
    name: AI review
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      ${{
        !github.event.pull_request.draft &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login == github.repository_owner
      }}
    permissions:
      contents: read # checkout of the BASE branch and reading it
      pull-requests: write # submit the review
      actions: read # count today's runs for the daily review budget
    env:
      # Spend guards. The reviewer runs on the maintainer's Claude subscription, whose limit is
      # shared with their own work, so a burst of pushes must not be able to drain it. A manual
      # re-run of the job (attempt 2 or later) skips the check on purpose.
      PER_PR_LIMIT: 6 # review attempts on one PR before it stops reviewing new pushes
      # Attempts, not reviews: failed runs and documentation-only approvals count too, and a heavy
      # day (several PRs with a few pushes each) reaches 40 quickly, so the limit is 80.
      DAILY_LIMIT: 80 # review attempts per UTC day, across all PRs
      # Seconds a run waits for further pushes before it does anything else. The budget count reads
      # the same number: a run cancelled after this wait may already be in the reviewer.
      DEBOUNCE_SECONDS: 60

    steps:
      # Debounce: a newer push cancels this run (concurrency above) while it is still waiting, so
      # a quick series of pushes costs one review, not one per push. Runner minutes are free on a
      # public repo; the model tokens are what this saves. Skipped on a manual re-run (attempt 2
      # or later): nobody is pushing then, the maintainer is waiting for the result.
      - name: Wait for further pushes
        if: ${{ github.run_attempt == 1 }}
        run: sleep "$DEBOUNCE_SECONDS"

      # No ref: on pull_request_target this is the base branch, never the PR head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Built from the per-file API instead of `gh pr diff` so lockfiles (large, machine-written, and
      # covered by dependency-review and Snyk) never reach the model. Only lockfiles are excluded,
      # matched by exact file name: an exclusion by directory or extension (dist/, *.min.js, ...)
      # would let a PR hide any file from the reviewer by choosing its path. Excluded files are
      # named at the top of the diff file, so the omission is visible.
      - name: Fetch the PR diff
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          mkdir -p .ai-review
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --jq '.[]' | jq -s '.' > .ai-review/files.json
          # A change is documentation-only when every file it touches (including the old name of a
          # renamed file) is a Markdown file under docs/ or CHANGELOG.md. AGENTS.md and CLAUDE.md
          # are excluded wherever they sit: they steer agents, so they are code, not documentation.
          # Anything else, including .github/, makes it an ordinary change that gets a model review.
          DOCS_ONLY=$(jq -r 'def ok: test("^(docs/.*\\.md|CHANGELOG\\.md)$") and (test("(^|/)(AGENTS|CLAUDE)\\.md$") | not);
            length > 0 and all(.[]; (.filename | ok) and ((.previous_filename // .filename) | ok))' .ai-review/files.json)
          echo "docs_only=${DOCS_ONLY}" >> "$GITHUB_OUTPUT"
          jq -r -f .github/ai-review/build-diff.jq .ai-review/files.json > .ai-review/pr.diff
          # The description as it is now, not as it was when the event fired, so an edit followed by
          # a re-run is seen. Capped: it is context, not review input.
          gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json body --jq '.body // ""' > .ai-review/pr-notes.full
          head -c 4000 .ai-review/pr-notes.full > .ai-review/pr-notes.md
          BYTES=$(wc -c < .ai-review/pr.diff)
          echo "Diff is ${BYTES} bytes"
          if [ "$BYTES" -gt 400000 ]; then
            echo "too_large=true" >> "$GITHUB_OUTPUT"
          fi
          if grep -q '^UNAVAILABLE:' .ai-review/pr.diff; then
            echo "unavailable=true" >> "$GITHUB_OUTPUT"
          fi

      # Counts every run that could have cost model tokens, whatever its outcome (the rules live in
      # .github/ai-review/count-attempts.jq and are unit tested): failed, timed out and successful
      # runs count, and so does a run cancelled by a newer push once it had lived past the debounce
      # wait (it may already have started the reviewer). Runs still in progress or queued count too, which narrows, but cannot remove, the
      # window in which two PRs check the budget at the same moment; the daily limit is therefore
      # a close bound, not an exact one.
      - name: Check the review budget
        id: budget
        if: ${{ github.run_attempt == 1 && steps.diff.outputs.docs_only != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          FIELDS=databaseId,status,conclusion,createdAt,startedAt,updatedAt
          PR_RUNS=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ai-review.yml --branch "$HEAD_REF" \
            --limit 200 --json "$FIELDS" | jq --argjson self "$RUN_ID" --argjson settle "$DEBOUNCE_SECONDS" -f .github/ai-review/count-attempts.jq)
          TODAY=$(date -u +%Y-%m-%d)
          DAY_RUNS=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ai-review.yml --created ">=${TODAY}" \
            --limit 200 --json "$FIELDS" | jq --argjson self "$RUN_ID" --argjson settle "$DEBOUNCE_SECONDS" -f .github/ai-review/count-attempts.jq)
          echo "Runs on this PR: ${PR_RUNS}/${PER_PR_LIMIT}; runs today: ${DAY_RUNS}/${DAILY_LIMIT}"
          if [ "$PR_RUNS" -ge "$PER_PR_LIMIT" ]; then
            echo "exhausted=true" >> "$GITHUB_OUTPUT"
            echo "reason=this PR has used its ${PER_PR_LIMIT} automated review attempts" >> "$GITHUB_OUTPUT"
          elif [ "$DAY_RUNS" -ge "$DAILY_LIMIT" ]; then
            echo "exhausted=true" >> "$GITHUB_OUTPUT"
            echo "reason=the daily budget of ${DAILY_LIMIT} automated review attempts is used up" >> "$GITHUB_OUTPUT"
          fi

      # The reviewer's prompt and output schema are files in the BASE branch checkout (never the PR's),
      # the same files the "AI review backtest" workflow measures, so a backtest of the `live` variant
      # is a test of exactly what runs here. A test (scripts/ai-review-single-source.test.mjs) keeps
      # this workflow from growing an inline copy again.
      - name: Load the reviewer prompt and schema
        id: reviewer
        if: steps.diff.outputs.too_large != 'true' && steps.diff.outputs.docs_only != 'true' && steps.budget.outputs.exhausted != 'true'
        run: |
          set -euo pipefail
          DELIM="EOF_$(openssl rand -hex 8)"
          {
            echo "prompt<<${DELIM}"
            cat .github/ai-review/prompt-live.md
            echo
            echo "${DELIM}"
            echo "schema=$(jq -c . .github/ai-review/schema-live.json)"
            echo "eligible=true"
          } >> "$GITHUB_OUTPUT"

      # An empty secret is a credential problem, not a reason to run an action that will fail on it.
      - name: Check the Claude credential
        id: claude_cred
        if: steps.reviewer.outputs.eligible == 'true'
        env:
          CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$CLAUDE_TOKEN" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      # continue-on-error so a failed run can be told apart below; the next step decides whether it
      # was a provider problem (fall back) or anything else (stay red, nothing is hidden).
      - name: Review the diff
        id: review
        if: steps.reviewer.outputs.eligible == 'true' && steps.claude_cred.outputs.present == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@8ce9314fa9a404564fa7e954cd84f25bcba2b829  # v1.0.236
        with:
          # The maintainer's Claude subscription (from `claude setup-token`), not per-token API billing.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.reviewer.outputs.prompt }}
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 20
            --allowedTools "Read,Grep,Glob"
            --json-schema '${{ steps.reviewer.outputs.schema }}'

      - name: Report review cost
        if: ${{ !cancelled() && steps.review.outputs.execution_file != '' }}
        env:
          EXEC_FILE: ${{ steps.review.outputs.execution_file }}
        run: |
          jq -r '[.. | objects | select(.type == "result")] | last | "AI review cost: \(.total_cost_usd // "n/a") USD, \(.num_turns // "n/a") turns"' "$EXEC_FILE" >> "$GITHUB_STEP_SUMMARY" || true

      # Fallback gate. Only a run that could not produce a review for a provider reason may fall
      # through to Codex: the reason comes from the typed errors in the execution file (rules and
      # tests in .github/ai-review/classify-claude-failure.jq), never from `failure()` alone. A
      # review with findings is a successful run and never gets here.
      - name: Decide whether Claude was unavailable
        id: claude_status
        if: ${{ !cancelled() && steps.reviewer.outputs.eligible == 'true' && steps.review.outcome != 'success' }}
        env:
          HAS_CREDENTIAL: ${{ steps.claude_cred.outputs.present }}
          EXEC_FILE: ${{ steps.review.outputs.execution_file }}
        run: |
          set -euo pipefail
          if [ "$HAS_CREDENTIAL" != "true" ]; then
            REASON=not_configured
          elif [ -n "$EXEC_FILE" ] && [ -f "$EXEC_FILE" ]; then
            REASON=$(jq -r -f .github/ai-review/classify-claude-failure.jq "$EXEC_FILE" || true)
          else
            REASON=""
          fi
          if [[ "$REASON" =~ ^[a-z_]+$ ]]; then
            echo "Claude unavailable: ${REASON}"
            echo "Falling back to Codex"
            { echo "fallback=true"; echo "reason=${REASON}"; } >> "$GITHUB_OUTPUT"
          else
            echo "::error::The Claude review failed, but not in a way that means the provider is unavailable, so Codex is not used. Check the 'Review the diff' step."
            { echo "fallback=false"; echo "reason=not_an_outage"; } >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        if: steps.claude_status.outputs.fallback == 'true'
        with:
          node-version: "24.17.0"

      # Pinned by version and lockfile (integrity hashes), installed into a temp directory, without
      # lifecycle scripts. A failure here is a CI problem and stays red.
      - name: Install the Codex CLI
        id: codex_cli
        if: steps.claude_status.outputs.fallback == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/codex-cli"
          cp .github/ai-review/codex/package.json .github/ai-review/codex/package-lock.json "$RUNNER_TEMP/codex-cli/"
          (cd "$RUNNER_TEMP/codex-cli" && npm ci --ignore-scripts --no-audit --no-fund)
          echo "bin=$RUNNER_TEMP/codex-cli/node_modules/.bin/codex" >> "$GITHUB_OUTPUT"

      # No continue-on-error: the script exits 0 for every "Codex is unavailable" case and reports it
      # in its outputs, so a non-zero exit is a bug in the script and stays red. No GitHub token here.
      - name: Review the diff with Codex
        id: codex
        if: steps.claude_status.outputs.fallback == 'true'
        timeout-minutes: 12
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          CODEX_BIN: ${{ steps.codex_cli.outputs.bin }}
        run: bash .github/ai-review/run-codex-review.sh

      - name: Report the reviewer provider
        if: ${{ !cancelled() && steps.reviewer.outputs.eligible == 'true' }}
        env:
          CLAUDE_OUTCOME: ${{ steps.review.outcome }}
          CLAUDE_REASON: ${{ steps.claude_status.outputs.reason }}
          CODEX_OK: ${{ steps.codex.outputs.ok }}
          CODEX_REASON: ${{ steps.codex.outputs.reason }}
        run: |
          if [ "$CLAUDE_OUTCOME" = "success" ]; then
            MSG="AI reviewer provider: Claude"
          elif [ "$CODEX_OK" = "true" ]; then
            MSG="Claude unavailable: ${CLAUDE_REASON}. AI reviewer provider: Codex (fallback)"
          elif [ -n "$CODEX_REASON" ]; then
            MSG="Claude unavailable: ${CLAUDE_REASON}. Codex unavailable: ${CODEX_REASON}. No review was produced"
          else
            MSG="Claude failed (${CLAUDE_REASON:-no result}); no fallback was attempted. No review was produced"
          fi
          echo "$MSG"
          echo "$MSG" >> "$GITHUB_STEP_SUMMARY"

      # Not always(): a run cancelled by a newer push must not go on to dismiss or post anything.
      - name: Submit the review
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TOO_LARGE: ${{ steps.diff.outputs.too_large }}
          UNAVAILABLE: ${{ steps.diff.outputs.unavailable }}
          DOCS_ONLY: ${{ steps.diff.outputs.docs_only }}
          BUDGET_EXHAUSTED: ${{ steps.budget.outputs.exhausted }}
          BUDGET_REASON: ${{ steps.budget.outputs.reason }}
          # Claude's review when it ran, otherwise Codex's: one review, one publication.
          STRUCTURED: ${{ steps.review.outputs.structured_output || steps.codex.outputs.structured }}
          REVIEWER: ${{ steps.review.outcome == 'success' && 'Claude' || (steps.codex.outputs.ok == 'true' && 'Codex' || '') }}
          CLAUDE_REASON: ${{ steps.claude_status.outputs.reason }}
          CODEX_REASON: ${{ steps.codex.outputs.reason }}
        run: |
          set -euo pipefail
          BODY="$RUNNER_TEMP/review.md"

          # Dismiss this bot's approvals of the reviewed commit. Every path that does not end in a
          # fresh approval goes through here first, including the ones that then fail the job, so
          # an approval from an earlier run on the same commit can never outlive a failed re-review.
          dismiss_bot_approvals() {
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" --paginate \
              --jq ".[] | select(.user.login == \"github-actions[bot]\" and .state == \"APPROVED\" and .commit_id == \"${HEAD_SHA}\") | .id" |
              while read -r RID; do
                gh api -X PUT "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews/${RID}/dismissals" \
                  -f message="AI review no longer approves this commit." -f event=DISMISS >/dev/null
              done
          }

          if [ "${BUDGET_EXHAUSTED:-}" = "true" ]; then
            dismiss_bot_approvals
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "**AI review skipped:** ${BUDGET_REASON}. Nothing was approved. Re-run the AI review job to review this commit anyway." || true
            exit 0
          fi

          if [ "${DOCS_ONLY:-}" = "true" ]; then
            printf '%s\n' '**Approved by a path rule, not by a model review.** Every file in this change is documentation (Markdown under docs/ or CHANGELOG.md), so no AI review was run. The required checks still apply, and the maintainer merges.' > "$BODY"
            APPROVE=true
          elif [ "${TOO_LARGE:-}" = "true" ]; then
            printf '%s\n' '**AI review skipped:** the diff is larger than the automated reviewer accepts. It is not approved; review it by hand.' > "$BODY"
            APPROVE=false
          elif [ -z "${STRUCTURED:-}" ] || ! jq -e '.verdict and .summary' <<< "$STRUCTURED" >/dev/null 2>&1; then
            echo "No usable verdict from the reviewer - not approving."
            dismiss_bot_approvals
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "**AI review could not run.** Claude: ${CLAUDE_REASON:-no result}. Codex fallback: ${CODEX_REASON:-not attempted}. Nothing was approved. Re-run the AI review job later." || true
            exit 1
          else
            {
              echo "**AI review** (automated, second identity; the maintainer merges)"
              if [ "${REVIEWER:-}" = "Codex" ]; then
                echo "_Reviewed by Codex: Claude was unavailable (${CLAUDE_REASON:-unknown})._"
              fi
              echo
              jq -r '.summary' <<< "$STRUCTURED"
              if [ "$(jq '.blocking_findings | length' <<< "$STRUCTURED")" -gt 0 ]; then
                echo
                echo "**Blocking findings**"
                jq -r '.blocking_findings[] | "- `\(.file)`: \(.issue)"' <<< "$STRUCTURED"
              fi
            } > "$BODY.full"
            # head after the group is written, not piped: a pipe into head would SIGPIPE the group
            # under pipefail as soon as the text passes the cap.
            head -c 8000 "$BODY.full" > "$BODY"
            if [ "$(jq -r '.verdict' <<< "$STRUCTURED")" = "approve" ] && \
               [ "$(jq '.blocking_findings | length' <<< "$STRUCTURED")" -eq 0 ]; then
              APPROVE=true
            else
              APPROVE=false
            fi
          fi

          # A file the reviewer could not see is never approved, whatever the model said.
          if [ "${UNAVAILABLE:-}" = "true" ]; then
            APPROVE=false
          fi

          # Fail closed: this is a public repo and the reviewer process holds the API key, so a
          # review text that looks like it carries a credential is never posted.
          if grep -Eq 'sk-ant-|gh[pousr]_[A-Za-z0-9]{20,}|github_pat_|-----BEGIN|eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}' "$BODY"; then
            echo "Review text looks like it contains a credential - not posting."
            dismiss_bot_approvals
            exit 1
          fi

          # The diff was read at HEAD_SHA. If a push landed while the reviewer ran, this run is stale
          # (its concurrency cancellation can race with this very call), so it submits nothing and
          # the run for the new head takes over.
          LIVE_HEAD="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha)"
          if [ "$LIVE_HEAD" != "$HEAD_SHA" ]; then
            echo "PR head moved from ${HEAD_SHA} to ${LIVE_HEAD} during the review - submitting nothing."
            exit 0
          fi

          # The review is always bound to the reviewed commit (commit_id), never to "latest".
          if [ "$APPROVE" != "true" ]; then
            dismiss_bot_approvals
            EVENT=COMMENT
          else
            EVENT=APPROVE
          fi
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" \
            -f commit_id="$HEAD_SHA" -f event="$EVENT" -F body=@"$BODY" >/dev/null
