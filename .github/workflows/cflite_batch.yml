name: ClusterFuzzLite batch fuzzing

# Longer, continuous-mode fuzzing run against the two harnesses under .clusterfuzzlite/fuzz/ -
# this (plus .clusterfuzzlite/Dockerfile existing at all) is what OpenSSF Scorecard's Fuzzing
# check looks for. Daily, not Google's own 6-hourly example cadence: two small, pure-function
# targets with a modest input space don't need that frequency, and this still accumulates and
# persists a corpus across runs (GitHub Actions cache, no extra config) the same way.
on:
  schedule:
    - cron: "0 3 * * *"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  batch-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      # output-sarif: true below uploads crash findings to the Security tab.
      security-events: write
    steps:
      # No sanitizer matrix (unlike ClusterFuzzLite's own C++ examples): `sanitizer: address`
      # fails outright for language: javascript ("JavaScript projects cannot be fuzzed with
      # sanitizers") - Jazzer.js instruments V8 bytecode for coverage instead of relying on
      # ASan/UBSan. Confirmed on a real run of this workflow that the action's own default is
      # `address`, not `none`, despite omitting the input working in local `docker run` testing -
      # `sanitizer: none` below must be explicit.
      - name: Build fuzzers
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1  # v1
        with:
          language: javascript
          sanitizer: none

      - name: Run fuzzers
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1  # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 3600
          mode: "batch"
          sanitizer: none
          output-sarif: true
