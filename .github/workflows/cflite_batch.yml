name: ClusterFuzzLite batch fuzzing

# Longer, continuous-mode fuzzing run against the two harnesses under .clusterfuzzlite/fuzz/ -
# this (plus .clusterfuzzlite/Dockerfile existing at all) is what OpenSSF Scorecard's Fuzzing
# check looks for. Daily, not Google's own 6-hourly example cadence: two small, pure-function
# targets with a modest input space don't need that frequency, and this still accumulates and
# persists a corpus across runs (GitHub Actions cache, no extra config) the same way.
on:
  schedule:
    - cron: "0 3 * * *"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  batch-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      # No sanitizer matrix (unlike ClusterFuzzLite's own C++ examples) - see cflite_pr.yml's own
      # comment for the two real-run findings that pinned this to exactly `coverage`.
      - name: Build fuzzers
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1  # v1
        with:
          language: javascript
          sanitizer: coverage

      # No output-sarif here - see cflite_pr.yml's own comment: it never actually uploads
      # anything, it only writes a local file inside the container that this workflow never reads.
      - name: Run fuzzers
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1  # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 3600
          mode: "batch"
          sanitizer: coverage
