name: Privacy Guard

# pull_request_target (not pull_request): the workflow definition used for this run is always
# the one on the base branch, even for same-repo PRs — a PR that edits this file cannot change
# the logic that scans its own diff or gain access to the secret through a modified script.
#
# We never checkout or `git fetch` anything from the PR — that alone is a flagged pattern
# (SonarCloud githubactions:S7631 / GitHub's own "Pwn Request" guidance) regardless of whether
# the fetched content is actually executed, since a git checkout can trigger diff/merge drivers,
# hooks, or submodule handling that a purely static review can't rule out. Instead we read the
# diff as plain text via the REST API (`GET .../pulls/{n}/files`), which is a JSON response over
# HTTPS — there is no git object, no working tree, nothing derived from the PR to execute.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: read
  # `gh api repos/.../git/blobs/{sha}` below (the lockfile hidden-diff verification) needs this -
  # GitHub's Get a blob endpoint is gated on Contents read, not Pull requests read. Read-only, and
  # this workflow still never checks out or fetches the PR itself (see the top comment) - the blob
  # is fetched by SHA over the REST API, not via git.
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Scan PR diff (via API) for sensitive patterns
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GUARD_PATTERNS: ${{ secrets.PII_DENYLIST }}
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          set -uo pipefail
          # deliberately not -e ourselves, BUT GitHub Actions' default bash invocation for a
          # `run:` step is `bash --noprofile --norc -eo pipefail {0}` regardless of what this
          # script sets — -e IS active here whether we ask for it or not. Every "run a command,
          # then inspect $? on the next line" spot below therefore needs the command itself to be
          # the left side of a `||`, since a bare failing command not otherwise exempted from -e
          # (not an if/while condition, not already part of && / ||) kills the whole step
          # immediately, with no output — before the very next line ever reads $?. Confirmed
          # empirically: `printf '' | grep -Eq -- "$pat"` returning 1 (the ordinary "no match"
          # outcome, not an error) took the entire job down silently on every single PR.

          # Forced explicitly: under the C/POSIX locale, grep does not reliably match character
          # classes or case-fold accented letters (e.g. Polish [oó]) — confirmed empirically on
          # the local pre-push hook's grep. C.UTF-8 is present on ubuntu-latest by default.
          export LC_ALL=C.UTF-8

          # pull_request_target hands secrets to fork PRs too (unlike plain pull_request) - a
          # public pass/fail result on a secret-backed comparison is an oracle: an outside
          # contributor could open a fork PR with candidate values and use repeated pass/fail
          # splits to reconstruct exactly what's in PII_DENYLIST, without the content ever being
          # printed. Only same-repo branches can be scanned safely, since opening one requires
          # write access this repo doesn't grant to strangers - this check runs first, before
          # GUARD_PATTERNS is even read, so a fork PR's outcome never depends on its content.
          if [ "${IS_FORK:-false}" = "true" ]; then
            echo "::notice::Privacy guard: skipped for a fork-originated PR — requires manual maintainer review before merge."
            exit 0
          fi

          if [ -z "${GUARD_PATTERNS:-}" ]; then
            echo "::warning::PII_DENYLIST secret not set — skipping privacy guard check"
            exit 0
          fi

          raw_file="$(mktemp)"; lit_file="$(mktemp)"; rx_file="$(mktemp)"
          trap 'rm -f "$raw_file" "$lit_file" "$rx_file"' EXIT
          printf '%s\n' "$GUARD_PATTERNS" > "$raw_file"

          # split into LITERAL (grep -F) and REGEX (grep -E) sections at the "___REGEX___" marker
          awk -v lit="$lit_file" -v rx="$rx_file" '
              /^___REGEX___[[:space:]]*$/ { mode=1; next }
              mode==0 { print > lit; next }
              { print > rx }
          ' "$raw_file"

          # drop blank/comment lines from both — an empty pattern in `grep -f` matches every line
          grep -Ev '^[[:space:]]*(#.*)?$' "$lit_file" > "${lit_file}.clean" 2>/dev/null || true
          mv "${lit_file}.clean" "$lit_file"
          grep -Ev '^[[:space:]]*(#.*)?$' "$rx_file" > "${rx_file}.clean" 2>/dev/null || true
          mv "${rx_file}.clean" "$rx_file"

          # a secret that's non-empty but reduces to nothing usable (only comments/whitespace,
          # or just the marker line) must not silently pass with zero patterns actually checked
          if [ ! -s "$lit_file" ] && [ ! -s "$rx_file" ]; then
            echo "::error::Privacy guard: PII_DENYLIST secret has no usable patterns after removing blank/comment lines. Fix the secret before this check can run."
            exit 1
          fi

          # validate every regex pattern compiles; never let a malformed pattern's grep error
          # (exit >=2) get silently swallowed into "no match"
          while IFS= read -r pat; do
            [ -z "$pat" ] && continue
            rc=0
            printf '' | grep -Eq -- "$pat" 2>/dev/null || rc=$?
            if [ "$rc" -ge 2 ]; then
              echo "::error::Privacy guard: malformed regex pattern in PII_DENYLIST secret (content withheld). Fix the secret before this check can run."
              exit 1
            fi
          done < "$rx_file"

          # The files-list endpoint below caps out at 3000 entries and silently returns a
          # truncated list past that - no error, no pagination past the cap - so a denylisted
          # value in an alphabetically later file could sail through unscanned on a huge PR
          # while this job still reports success. `changed_files` on the PR itself is the true
          # total, independent of that cap - check it first and fail closed if it could exceed
          # what the files endpoint can actually return.
          cf_rc=0
          changed_files_count="$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.changed_files')" || cf_rc=$?
          if [ "$cf_rc" -ne 0 ] || [ -z "$changed_files_count" ]; then
            echo "::error::Privacy guard: failed to determine this PR's changed-file count (exit $cf_rc). Failing closed rather than risking a silently truncated scan."
            exit 1
          fi
          if [ "$changed_files_count" -gt 3000 ]; then
            echo "::error::Privacy guard: this PR changes $changed_files_count files - the GitHub API caps the file list at 3000 and returns it silently truncated beyond that. Failing closed rather than accepting a partial scan; split this PR into smaller ones."
            exit 1
          fi

          # Diff via the API, not git: each entry's `patch` is the unified diff text for that
          # file (omitted by GitHub for binary files, and for text files whose diff is too large -
          # exactly the large-CSV-export case this check most needs to catch). A file with real
          # additions but no `.patch` is flagged UNSCANNABLE below and fails closed rather than
          # being silently treated as "nothing added".
          #
          # Exception: package-manager lockfiles, but only when GitHub omitted the patch
          # (UNSCANNABLE) - a lockfile small enough that the API *did* return its patch is still
          # scanned below exactly like any other file, unchanged. A hidden lockfile diff is NOT
          # trusted by basename alone either (a file merely named package-lock.json could contain
          # anything, and even a genuine lockfile's resolved-package URLs could in principle carry
          # embedded credentials for a misconfigured private registry) - instead its full content
          # at this PR's head is fetched via the git blobs API below and folded into scan_targets,
          # so the denylist is checked against what the file actually contains. The blobs API has
          # no practical size cap here (up to 100MB; this repo's lockfile is under 1MB), unlike the
          # diff view, which is exactly why this path exists: routine lockfile regenerations
          # regularly exceed the diff view's undocumented size cap and trip UNSCANNABLE on a file
          # that was never at risk (seen in practice: a ~3500-line package-lock.json diff from a
          # single dependency bump). The filename itself is still scanned below like any other file.
          #
          # `.filename` matters just as much as content (a new file whose own path leaks a value,
          # e.g. an export literally named after someone's email, would otherwise sail through
          # unscanned) - but only for statuses that introduce or keep that path in the tree.
          # A "removed" entry's `.filename` is the path being deleted: flagging it as a hit would
          # block a PR that's cleaning up an old leak, exactly backwards from the intent here.
          # `gh api --jq` (unlike plain jq) accepts exactly one positional argument and has no
          # `--arg` passthrough, so the CSV crosses the shell/jq boundary via jq's builtin `env`
          # object instead - export it, then read `env.LOCKFILE_BASENAMES` from inside the program.
          export LOCKFILE_BASENAMES="package-lock.json,npm-shrinkwrap.json,yarn.lock,pnpm-lock.yaml,Gemfile.lock,poetry.lock,Pipfile.lock,Cargo.lock,go.sum,composer.lock"
          api_rc=0
          # $lf and $base below are jq variables, not shell ones - the whole program is
          # deliberately single-quoted so the shell leaves them alone.
          # shellcheck disable=SC2016
          raw_scan="$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '
            (env.LOCKFILE_BASENAMES | split(",")) as $lf |
            .[] |
            (if .status != "removed" then "FILENAME:" + .filename else empty end),
            (
              (.filename | split("/") | last) as $base |
              if .patch == null and (.additions // 0) > 0 then
                if ($lf | index($base)) != null then "LOCKFILEBLOB:" + .sha + " " + .filename
                else "UNSCANNABLE:" + .filename
                end
              else (.patch // empty)
              end
            )
          ')" || api_rc=$?
          if [ "$api_rc" -ne 0 ]; then
            echo "::error::Privacy guard: failed to fetch the PR diff via the GitHub API (exit $api_rc). Failing closed rather than merging unscanned."
            exit 1
          fi

          # `|| true`: with pipefail, a pipeline's status is its rightmost non-zero exit code even
          # when a later stage (sed here) itself succeeds - grep finding zero matches (the normal
          # case whenever nothing is UNSCANNABLE/FILENAME/added) is not an error, just an empty
          # result, and must not be allowed to trip -e the same way the spots above did.
          unscannable="$(printf '%s\n' "$raw_scan" | grep '^UNSCANNABLE:' | sed 's/^UNSCANNABLE://')" || true
          if [ -n "$unscannable" ]; then
            echo "::error::Privacy guard: GitHub omitted the diff for the following file(s) with added content (too large or binary) - cannot verify they're clean. Failing closed; review manually before merging: $unscannable"
            exit 1
          fi

          filenames="$(printf '%s\n' "$raw_scan" | grep '^FILENAME:' | sed 's/^FILENAME://')" || true
          # exactly one leading "+" stripped - it's the diff marker, not part of the real content.
          # An anchored pattern like `^value$` in the denylist would otherwise never match (every
          # added line's actual first character is shifted one position by the marker), and a
          # value whose own real content starts with "+" would be scanned with a synthetic extra
          # one prepended.
          added_lines="$(printf '%s\n' "$raw_scan" | grep -Ev '^(FILENAME|UNSCANNABLE):' | grep -E '^\+' | sed 's/^+//')" || true

          # A hidden lockfile diff (see the LOCKFILEBLOB case above) is verified here by fetching
          # its full head-ref content and folding it in, rather than skipped on trust in the name.
          lockfile_blob_refs="$(printf '%s\n' "$raw_scan" | grep '^LOCKFILEBLOB:' | sed 's/^LOCKFILEBLOB://')" || true
          lockfile_blob_content=""
          if [ -n "$lockfile_blob_refs" ]; then
            while IFS= read -r ref; do
              [ -z "$ref" ] && continue
              blob_sha="${ref%% *}"
              blob_name="${ref#* }"
              blob_b64_rc=0
              blob_b64="$(gh api "repos/$REPO/git/blobs/$blob_sha" --jq '.content')" || blob_b64_rc=$?
              if [ "$blob_b64_rc" -ne 0 ] || [ -z "$blob_b64" ]; then
                echo "::error::Privacy guard: failed to fetch full content for lockfile '$blob_name' (blob $blob_sha) to verify its hidden diff. Failing closed rather than merging unscanned."
                exit 1
              fi
              blob_text="$(printf '%s' "$blob_b64" | tr -d '\n' | base64 -d 2>/dev/null)" || true
              if [ -z "$blob_text" ]; then
                echo "::error::Privacy guard: fetched content for lockfile '$blob_name' (blob $blob_sha) decoded to nothing. Failing closed rather than merging unscanned."
                exit 1
              fi
              lockfile_blob_content="$(printf '%s\n%s\n' "$lockfile_blob_content" "$blob_text")"
            done <<< "$lockfile_blob_refs"
          fi

          scan_targets="$(printf '%s\n%s\n%s\n' "$filenames" "$added_lines" "$lockfile_blob_content")"

          if [ -z "$(printf '%s' "$scan_targets" | tr -d '[:space:]')" ]; then
            echo "Privacy guard: nothing to scan (no changed filenames or added lines)."
            exit 0
          fi

          blocked=0

          if [ -s "$lit_file" ]; then
            rc=0
            printf '%s\n' "$scan_targets" | grep -Fqi -f "$lit_file" || rc=$?
            { [ "$rc" -eq 0 ] || [ "$rc" -ge 2 ]; } && blocked=1
          fi

          if [ -s "$rx_file" ]; then
            rc=0
            printf '%s\n' "$scan_targets" | grep -Eqi -f "$rx_file" || rc=$?
            { [ "$rc" -eq 0 ] || [ "$rc" -ge 2 ]; } && blocked=1
          fi

          if [ "$blocked" -eq 1 ]; then
            echo "::error::Privacy guard: potential sensitive data detected (or the scan itself failed) in this diff. Content is not shown here for safety — review your changes locally before merging."
            exit 1
          fi

          echo "Privacy guard: no matches."
