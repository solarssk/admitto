name: Semgrep

# PRs: CodeQL (security-extended) is the SAST gate. This workflow blocks merges to
# `main` and runs weekly — Semgrep and CodeQL rule sets are complementary, not
# identical (see SECURITY.md).

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.11"

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip wheel --break-system-packages
          # semgrep 1.136.x still imports pkg_resources via opentelemetry; setuptools 82+ drops it on GH runners
          python -m pip install "setuptools>=69,<82" --break-system-packages
          python -m pip install semgrep==1.136.0 --break-system-packages

      - name: Run Semgrep
        # --error: gate on main merge and weekly schedule. PRs use CodeQL for SAST feedback.
        run: |
          semgrep scan \
            --config=p/javascript \
            --config=p/typescript \
            --error \
            --sarif \
            --output=semgrep.sarif \
            . \
            --exclude node_modules \
            --exclude dist \
            --exclude coverage

          if [ ! -f semgrep.sarif ]; then
            printf '%s\n' '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[{"tool":{"driver":{"name":"Semgrep","informationUri":"https://semgrep.dev","rules":[]}},"results":[]}]}' > semgrep.sarif
          fi
        env:
          SEMGREP_SEND_METRICS: "on"

      - uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e  # v4
        if: always()
        with:
          sarif_file: semgrep.sarif
