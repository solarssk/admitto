name: Semgrep

# CodeQL (security-extended) and Semgrep rule sets are complementary, not identical
# (see SECURITY.md) - both now run on every PR so a pattern one engine misses isn't
# left undetected on main until the weekly schedule.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1"

# See ci.yml's own concurrency block for the full rationale - same group/cancel pattern so a
# superseded PR push doesn't leave a stale `semgrep` run racing the new one, while main pushes and
# the weekly schedule each get their own group (via `github.run_id`) and so never queue-drop each
# other's run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  semgrep:
    name: Code security scan (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required by github/codeql-action/upload-sarif below to upload SARIF to the Security tab -
      # the Code Scanning API itself gates this write on the security-events scope, no narrower
      # alternative exists. Declared at job level rather than top level on purpose: Scorecard's
      # Token-Permissions check only recognizes this as a permitted SARIF-upload pattern (and
      # skips flagging it) when the grant is job-scoped - verified against its own source
      # (checks/raw/permissions.go's validateTopLevelPermissions always passes an empty exemption
      # map; only validatejobLevelPermissions receives the codeql-action allowlist).
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Guard PyJWT security floor
        # semgrep-requirements.txt hand-pins pyjwt above semgrep's own range (see the Install
        # Semgrep step below), and a routine pip-compile regeneration - for example a Dependabot
        # bump of pip, wheel or setuptools - silently restores 2.13.0, which has ten open
        # advisories. Fail here with the fix spelled out. A floor rather than an exact match, so
        # it stays correct (and can simply be left in place) once semgrep allows a newer pyjwt.
        run: |
          version=$(sed -n 's/^pyjwt\[crypto\]==\([0-9.]*\).*/\1/p' .github/workflows/semgrep-requirements.txt)
          if [ -z "$version" ] || [ "$(printf '%s\n2.14.0\n' "$version" | sort -V | head -n1)" != "2.14.0" ]; then
            echo "::error file=.github/workflows/semgrep-requirements.txt::pyjwt is '${version:-missing}', expected >= 2.14.0. A pip-compile regeneration reverted the hand-pin: re-apply pyjwt[crypto]==2.14.0 with its hashes (see the Install Semgrep comment below), or update this floor once semgrep allows a newer pyjwt."
            exit 1
          fi

      - name: Install Semgrep
        # semgrep==1.177.0 (bumped from 1.136.0): the lower version's own opentelemetry pin
        # transitively capped protobuf<5.0, which was stuck on a known-vulnerable release
        # (GHSA-7gcm-g887-7qv7) with no patched 4.x build available - only newer semgrep releases
        # move to an opentelemetry line that allows a patched protobuf. Every package version
        # pinned below (including setuptools==83.0.0 and pip==26.2.1) is reproducible on purpose,
        # so the exact installed set is auditable (SonarCloud githubactions:S8544) - verified
        # `pip-audit`-clean as a set before pinning, not just individually version-bumped.
        # --only-binary=:all: rejects source distributions, whose build hooks could run arbitrary
        # code during installation. The locked set is verified to publish Linux/Python 3.11 wheels.
        # --require-hashes (Scorecard's Pinned-Dependencies check) needs every package pip
        # resolves, including transitive dependencies, listed with its hash - semgrep-requirements.txt
        # is pip-compile's full closure for semgrep-requirements.in, not hand-maintained. Regenerate
        # after bumping a version in the .in file:
        #   pip-compile --generate-hashes --allow-unsafe \
        #     --output-file=.github/workflows/semgrep-requirements.txt \
        #     .github/workflows/semgrep-requirements.in
        # then re-run `pip-audit -r .github/workflows/semgrep-requirements.txt` before committing.
        #
        # --no-deps: the closure above is already complete and hash-pinned, so pip has nothing left
        # to resolve. It is needed because pyjwt is hand-pinned to 2.14.0 in that file (fixes ten
        # advisories, including the critical GHSA-ffc3-869f-jxw9) while semgrep 1.178.0, the
        # newest release, still declares `pyjwt[crypto]~=2.13.0`, so a resolving install fails
        # with ResolutionImpossible. Semgrep only imports jwt in its `semgrep mcp` server
        # (semgrep/mcp/utilities/token_verifier.py); this job runs `semgrep scan`, which never
        # loads it. Upstream tracks the too-tight range in semgrep/semgrep#11925. Once a semgrep
        # release allows pyjwt>=2.14, regenerate the requirements with pip-compile (which drops
        # the hand-pin) and remove --no-deps.
        run: |
          python -m pip install --only-binary=:all: --require-hashes --no-deps -r .github/workflows/semgrep-requirements.txt --break-system-packages

      - name: Run Semgrep
        # --error: any finding fails the job, on PRs, main merges, and the weekly schedule alike.
        run: |
          semgrep scan \
            --config=p/javascript \
            --config=p/typescript \
            --error \
            --sarif \
            --output=semgrep.sarif \
            . \
            --exclude node_modules \
            --exclude dist \
            --exclude coverage

          if [ ! -f semgrep.sarif ]; then
            # Literal SARIF JSON: "$schema" is a JSON key, not a shell variable, and must stay
            # unexpanded - single-quoting is intentional here, not an oversight.
            # shellcheck disable=SC2016
            printf '%s\n' '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[{"tool":{"driver":{"name":"Semgrep","informationUri":"https://semgrep.dev","rules":[]}},"results":[]}]}' > semgrep.sarif
          fi
        env:
          SEMGREP_SEND_METRICS: "on"

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4
        if: always()
        with:
          sarif_file: semgrep.sarif
