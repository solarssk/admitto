name: Semgrep

# PRs: CodeQL (security-extended) is the SAST gate. This workflow blocks merges to
# `main` and runs weekly — Semgrep and CodeQL rule sets are complementary, not
# identical (see SECURITY.md).

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip==26.1.2 wheel==0.47.0 --break-system-packages
          # semgrep 1.136.x still imports pkg_resources via opentelemetry; setuptools 82+ drops it
          # on GH runners. Pinned to the newest release still inside that safe window (not just a
          # range) so the exact installed version is reproducible (SonarCloud githubactions:S8544).
          python -m pip install setuptools==81.0.0 --break-system-packages
          python -m pip install semgrep==1.136.0 --break-system-packages

      - name: Run Semgrep
        # --error: gate on main merge and weekly schedule. PRs use CodeQL for SAST feedback.
        run: |
          semgrep scan \
            --config=p/javascript \
            --config=p/typescript \
            --error \
            --sarif \
            --output=semgrep.sarif \
            . \
            --exclude node_modules \
            --exclude dist \
            --exclude coverage

          if [ ! -f semgrep.sarif ]; then
            printf '%s\n' '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[{"tool":{"driver":{"name":"Semgrep","informationUri":"https://semgrep.dev","rules":[]}},"results":[]}]}' > semgrep.sarif
          fi
        env:
          SEMGREP_SEND_METRICS: "on"

      - uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3  # v4
        if: always()
        with:
          sarif_file: semgrep.sarif
