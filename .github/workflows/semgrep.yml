name: Semgrep

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: pip install semgrep --break-system-packages
      - name: Run Semgrep
        run: |
          TARGETS=$(for d in packages apps; do [ -d "$d" ] && echo "$d"; done)
          semgrep scan --config=auto --sarif --output=semgrep.sarif $TARGETS || true
          [ -f semgrep.sarif ] || echo '{"version":"2.1.0","runs":[]}' > semgrep.sarif
        env:
          SEMGREP_SEND_METRICS: "off"
      - uses: github/codeql-action/upload-sarif@dd903d2e4f5405488e5ef1422510ee31c8b32357  # v3
        if: always()
        with:
          sarif_file: semgrep.sarif
