name: CodeQL

on:
  push:
    branches: [main]
  # No `branches:` filter here on purpose — same reasoning as ci.yml's `pull_request` trigger:
  # a `branches: [main]` filter silently skips this required `analyze` check for every PR in a
  # stack once the bottom-most link merges and its base ref stops resolving to `main`.
  pull_request: {}
  schedule:
    - cron: "0 3 * * 1"

# See ci.yml's own concurrency block for the full rationale - same group/cancel pattern so a
# superseded PR push doesn't leave a stale `analyze` run (a required status check) racing the new
# one, while main pushes and the weekly schedule always run to completion uncancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
