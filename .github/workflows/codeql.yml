name: CodeQL

on:
  push:
    branches: [main]
  # No `branches:` filter here on purpose — same reasoning as ci.yml's `pull_request` trigger:
  # a `branches: [main]` filter silently skips this required `analyze` check for every PR in a
  # stack once the bottom-most link merges and its base ref stops resolving to `main`.
  pull_request: {}
  schedule:
    - cron: "0 3 * * 1"

# See ci.yml's own concurrency block for the full rationale - same group/cancel pattern so a
# superseded PR push doesn't leave a stale `analyze` run (a required status check) racing the new
# one, while main pushes and the weekly schedule always run to completion uncancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required by github/codeql-action/analyze below to upload SARIF to the Security tab - the
      # Code Scanning API itself gates this write on the security-events scope, no narrower
      # alternative exists. Declared at job level rather than top level on purpose: Scorecard's
      # Token-Permissions check only recognizes this as a permitted SARIF-upload pattern (and
      # skips flagging it) when the grant is job-scoped - verified against its own source
      # (checks/raw/permissions.go's validateTopLevelPermissions always passes an empty exemption
      # map; only validatejobLevelPermissions receives the codeql-action allowlist).
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63  # v4.38.0
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/autobuild@b96794f015dfd88f77b49b1c93e0fa7110f94c63  # v4.38.0
      - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63  # v4.38.0
