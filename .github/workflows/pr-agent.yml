name: PR-Agent

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pr_agent:
    runs-on: ubuntu-latest
    if: ${{ github.event.sender.type != 'Bot' }}
    steps:
      - uses: Codium-ai/pr-agent@31d7dd027968e5fad1f9cbb074be047c4869058e  # HEAD 2026-06-08
        env:
          OPENAI.API_TYPE: "anthropic"
          OPENAI_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC.MODEL: "claude-sonnet-4-6"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
