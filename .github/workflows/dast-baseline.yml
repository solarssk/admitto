name: DAST baseline scan

# Dynamic scan on top of the same docker-compose stack deploy-smoke.yml already builds and
# health-checks (see that workflow for the stack itself). Runs OWASP ZAP's baseline scan
# (passive rules + a short spidering crawl, no active/attack payloads) against the
# unauthenticated, public/login-adjacent surface only — a fresh stack's database has no users, so
# a synthetic one is seeded first (isFirstRunRequired() otherwise redirects every staff path to
# /setup, not the pages this workflow means to scan - see deploy/README.md's "First superadmin").
# Two scans run, since action-baseline only takes one target per invocation: / (spidered from the
# real login page once seeded) and /healthz explicitly (a machine health-check endpoint no page
# links to, so spidering from / would never reach it on its own).
#
# What this covers: missing security headers, cookie flags, information disclosure, and other
# passive-scan findings on the surface a request can reach before authenticating.
# A third scan covers the signed-in superadmin surface: scripts/dast-login.mjs walks the forced TOTP
# enrollment over HTTP for the seeded account and ZAP is handed the resulting session cookie
# (ZAP_AUTH_HEADER), then crawls /admin with its AJAX spider so the SPA's own API calls are
# exercised and passively scanned too.
#
# What this does NOT cover yet: /operator (needs an event-scoped operator account, which the compose
# stack has no CLI to create), and active/attack scanning (ZAP's full scan, not baseline, which is
# unsuitable for a shared CI stack).
#
# Report-only: fail_action is false and this does not gate merges. Full HTML/JSON/MD reports are
# uploaded as workflow artifacts; a parsed risk/alert/count summary for each target is also
# written to the run's job summary so findings are visible without downloading anything. ZAP's
# baseline scanner has no native SARIF output, so Security-tab integration is left for a
# follow-up rather than bolting on a hand-rolled converter.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC

# A manual dispatch could otherwise overlap the weekly schedule's own run of this workflow.
concurrency:
  group: dast-baseline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dast-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare deploy env
        working-directory: deploy
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=smoke-test-secret/' .env
          sed -i 's|^DATABASE_URL=.*|DATABASE_URL=postgresql://admitto_app:smoke-test-secret@db:5432/admitto|' .env
          ENCRYPTION_KEY=$(openssl rand -base64 32)
          node -e "if (Buffer.from(process.argv[1], 'base64').length !== 32) { console.error('ENCRYPTION_KEY must decode to 32 bytes'); process.exit(1); }" "$ENCRYPTION_KEY"
          sed -i "s|^ENCRYPTION_KEY=.*|ENCRYPTION_KEY=${ENCRYPTION_KEY}|" .env
          sed -i 's|^BASE_URL=.*|BASE_URL=http://127.0.0.1:8080|' .env
          sed -i 's/^REDIS_PASSWORD=.*/REDIS_PASSWORD=smoke-redis-secret/' .env
          sed -i 's|^REDIS_URL=.*|REDIS_URL=redis://:smoke-redis-secret@redis:6379|' .env
          node validate-env.mjs .env

      # Compose otherwise creates ./emergency-exports as root-owned on a fresh runner; the app
      # container runs as UID 1000 and can't write to it, which fails the seed step below (its
      # bootstrap-superadmin CLI checks that this dir is writable before doing anything else).
      - name: Prepare host bind-mount dirs
        working-directory: deploy
        run: sudo ./scripts/init-host-dirs.sh

      - name: Build and start stack
        working-directory: deploy
        run: docker compose up -d --build

      - name: Wait for healthy proxy
        run: |
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080/healthz >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "healthz never became ready"
          docker compose -f deploy/docker-compose.yml logs
          exit 1

      # A fresh stack's database has no users, and isFirstRunRequired() (apps/web/src/setup-routes.ts)
      # redirects /, /login, and every other staff path to /setup until one exists (documented in
      # deploy/README.md's "First superadmin" section) - without this, ZAP's spider only ever
      # reaches the first-run setup wizard, never the actual login page this workflow means to
      # scan. Same CLI this repo documents for break-glass recovery; a random password since
      # nothing ever needs to sign in as this account, only for it to exist.
      - name: Seed a synthetic superadmin so /login resolves
        working-directory: deploy
        run: |
          DAST_PASSWORD=$(openssl rand -base64 24)
          echo "::add-mask::$DAST_PASSWORD"
          echo "DAST_PASSWORD=$DAST_PASSWORD" >> "$GITHUB_ENV"
          printf '%s\n' "$DAST_PASSWORD" | docker compose run --rm -T app node packages/auth/dist/cli.js bootstrap-superadmin --email dast-scan@example.com

      - name: ZAP baseline scan (/, spidered from the real login page)
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25  # v0.15.0
        with:
          target: "http://127.0.0.1:8080"
          artifact_name: "zap-baseline-report"
          # Report-only per this workflow's scope — do not fail CI on findings and do not file a
          # GitHub issue; the uploaded artifact is the record for now.
          fail_action: false
          allow_issue_writing: false

      # action-baseline always writes to the same fixed filenames (report_json.json etc.) in the
      # workspace root, so this must run before the /healthz scan below overwrites them. Without
      # this, findings only ever exist in the downloadable artifact - nothing prompts anyone to
      # open it (audit: DAST results write-only, no escalation path).
      - name: Summarize / scan into job summary
        if: always()
        run: |
          {
            echo "### DAST baseline: / (spidered from login page)"
            echo
            if [ -s report_json.json ] && [ "$(jq '.site[0].alerts | length' report_json.json)" -gt 0 ]; then
              echo "| Risk | Alert | Count |"
              echo "|---|---|---|"
              jq -r '.site[0].alerts[] | "| " + .riskdesc + " | " + .name + " | " + (.count|tostring) + " |"' report_json.json
            else
              echo "No findings."
            fi
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      # /healthz isn't linked from any page a spider would crawl (it's a machine health-check
      # endpoint, not a user-facing one), so it needs its own explicit scan rather than relying on
      # discovery from the / target above - action-baseline only accepts a single `target` per run.
      - name: ZAP baseline scan (/healthz, not reachable by spidering from /)
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25  # v0.15.0
        with:
          target: "http://127.0.0.1:8080/healthz"
          artifact_name: "zap-baseline-report-healthz"
          fail_action: false
          allow_issue_writing: false

      - name: Summarize /healthz scan into job summary
        if: always()
        run: |
          {
            echo "### DAST baseline: /healthz"
            echo
            if [ -s report_json.json ] && [ "$(jq '.site[0].alerts | length' report_json.json)" -gt 0 ]; then
              echo "| Risk | Alert | Count |"
              echo "|---|---|---|"
              jq -r '.site[0].alerts[] | "| " + .riskdesc + " | " + .name + " | " + (.count|tostring) + " |"' report_json.json
            else
              echo "No findings."
            fi
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24.17.0"

      # Signs in as the seeded superadmin (walking the forced TOTP enrollment) and exports the session
      # cookie for the authenticated scan below. The account and its TOTP secret live only in this
      # run's disposable stack.
      - name: Sign in and capture a session cookie
        env:
          BASE_URL: http://127.0.0.1:8080
          DAST_EMAIL: dast-scan@example.com
        run: |
          COOKIE=$(node scripts/dast-login.mjs)
          echo "::add-mask::$COOKIE"
          echo "DAST_COOKIE=$COOKIE" >> "$GITHUB_ENV"

      # ZAP_AUTH_HEADER* are the env vars zaproxy/action-baseline forwards into its container: ZAP
      # then adds this header to every request to that site. The logout exclusions matter: the AJAX
      # spider clicks buttons, and one press of "Sign out" would revoke the session mid-scan.
      - name: ZAP baseline scan (/admin, authenticated, AJAX spider)
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25  # v0.15.0
        env:
          ZAP_AUTH_HEADER: Cookie
          ZAP_AUTH_HEADER_VALUE: ${{ env.DAST_COOKIE }}
          ZAP_AUTH_HEADER_SITE: 127.0.0.1
        with:
          target: "http://127.0.0.1:8080/admin/"
          artifact_name: "zap-baseline-report-admin"
          cmd_options: '-j -m 3 -z "-config globalexcludeurl.url_list.url(0).regex=.*/logout.* -config globalexcludeurl.url_list.url(0).enabled=true"'
          fail_action: false
          allow_issue_writing: false

      - name: Summarize /admin scan into job summary
        if: always()
        run: |
          {
            echo "### DAST baseline: /admin (authenticated as superadmin)"
            echo
            if [ -s report_json.json ] && [ "$(jq '.site[0].alerts | length' report_json.json)" -gt 0 ]; then
              echo "| Risk | Alert | Count |"
              echo "|---|---|---|"
              jq -r '.site[0].alerts[] | "| " + .riskdesc + " | " + .name + " | " + (.count|tostring) + " |"' report_json.json
            else
              echo "No findings."
            fi
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tear down
        if: always()
        working-directory: deploy
        run: docker compose down -v
