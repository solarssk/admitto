name: Publish Wiki

on:
  push:
    branches: [main]
    paths:
      - "docs/wiki/**"
      - ".github/workflows/publish-wiki.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Wiki source
        run: node scripts/check-wiki-docs.mjs
      # GitHub has no separate, narrower wiki-write scope - pushing to the wiki git remote is
      # gated by the same Contents permission as the parent repo. Mints a short-lived token from
      # the dedicated "admitto-release-automation" GitHub App instead of using GITHUB_TOKEN, so
      # this job's own GITHUB_TOKEN permissions above can stay read-only.
      - name: Mint release automation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - name: Synchronize GitHub Wiki
        env:
          WIKI_REMOTE: https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/${{ github.repository }}.wiki.git
        run: |
          wiki_publish_dir=$(mktemp -d)
          trap 'rm -rf "$wiki_publish_dir"' EXIT
          git clone "$WIKI_REMOTE" "$wiki_publish_dir"
          rsync -a --delete --exclude=.git docs/wiki/ "$wiki_publish_dir/"
          git -C "$wiki_publish_dir" diff --check
          if git -C "$wiki_publish_dir" diff --quiet; then
            echo "Wiki is already current."
            exit 0
          fi
          git -C "$wiki_publish_dir" config user.name "github-actions[bot]"
          git -C "$wiki_publish_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$wiki_publish_dir" add --all
          git -C "$wiki_publish_dir" commit -m "docs(wiki): publish ${GITHUB_SHA}"
          git -C "$wiki_publish_dir" push origin HEAD:master
