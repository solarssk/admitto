name: Publish container

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build (semver tag publishes; branch ref scan-only)
        required: true
        default: refs/heads/main

# Scoped to the resolved ref (the pushed tag, or the dispatched ref) so two overlapping runs for
# the same release can't interleave digest exports or race the release-creation/upload calls.
# cancel-in-progress stays false, matching release.yml - a publish in flight must finish, not be
# cut off mid-push.
# Empty top-level default (deny-all) - every job below declares its own least-privilege set on
# top of this. Satisfies Scorecard's Token-Permissions check, which requires a topLevel
# `permissions:` key to exist even though the real scoping happens per job.
permissions: {}

concurrency:
  group: publish-container-${{ github.event.inputs.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  # Resolves the release tag/publish decision and the final image tags/labels once, so both
  # matrix legs below and the merge job agree on exactly the same values instead of each
  # recomputing (and risking drift between) the same logic.
  # Permissions are granted per job below (SonarCloud githubactions:S8233), not at the workflow
  # level - each job below gets only what it actually uses, not the union of every job's needs.
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # reject manual/emergency tags whose commit has not passed main CI
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      tag: ${{ steps.release.outputs.tag }}
      artifact_slug: ${{ steps.release.outputs.artifact_slug }}
      sha: ${{ steps.commit.outputs.sha }}
      meta-labels: ${{ steps.meta.outputs.labels }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
          persist-credentials: false

      - name: Resolve release tag
        id: release
        env:
          # inputs.ref is attacker-controllable (anyone with dispatch access chooses it) — never
          # interpolate it directly into the run: script text, which GitHub substitutes as raw
          # characters before bash parses them (script injection, SonarCloud githubactions:S7630).
          # Passing it through env: makes it a normal shell variable value instead.
          DISPATCH_REF: ${{ inputs.ref }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REF="$DISPATCH_REF"
          else
            REF="${GITHUB_REF}"
          fi
          case "$REF" in
            refs/tags/*)
              TAG="${REF#refs/tags/}"
              if printf '%s' "$TAG" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
                echo "publish=true" >> "$GITHUB_OUTPUT"
                echo "artifact_slug=${TAG}" >> "$GITHUB_OUTPUT"
              else
                echo "publish=false" >> "$GITHUB_OUTPUT"
                echo "artifact_slug=ci-scan" >> "$GITHUB_OUTPUT"
              fi
              ;;
            *)
              TAG="${REF#refs/heads/}"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "artifact_slug=ci-scan" >> "$GITHUB_OUTPUT"
              ;;
          esac
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Verify release commit CI also for manual or emergency tags
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: GITHUB_SHA="$(git rev-parse HEAD)" bash scripts/wait-for-release-ci.sh

      # The commit actually checked out - not github.sha. A workflow_dispatch republish of a tag
      # (the documented recovery path when a tag-push run fails) runs the workflow file from
      # main, so github.sha is main's HEAD while the checkout above is the tag's commit. Stamping
      # github.sha put a later commit into the image's revision label and GIT_COMMIT (the admin
      # health check shows it) for v0.7.3, contradicting the provenance attestation's vcs:revision.
      - name: Resolve checked-out commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        if: steps.release.outputs.publish == 'true'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.release.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release.outputs.tag }}
          # metadata-action derives revision from github.sha; a custom label with the same key
          # wins (its label list is de-duplicated last-value-wins).
          labels: |
            org.opencontainers.image.revision=${{ steps.commit.outputs.sha }}

  # Builds and scans one platform per native runner, then smoke-tests its immutable digest before
  # publishing any version tags. Untagged candidate digests are staged in ghcr.io first.
  # Native runners avoid QEMU, so `npm ci` inside the Dockerfile resolves each platform's own native
  # dependency binaries (sharp/libvips, Prisma's query engine, argon2, esbuild, lightningcss)
  # correctly, the same way it already does for amd64 today. arm64 uses GitHub's free-for-public-
  # repos hosted arm64 runner (GA since 2025-08, ubuntu-24.04-arm) - no cost, no self-hosted
  # runner to maintain.
  build-and-scan:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write # docker login + push-by-digest to ghcr.io
      security-events: write # SARIF upload to the Security tab
    env:
      SCAN_IMAGE: ghcr.io/${{ github.repository }}:ci-scan-${{ matrix.suffix }}
      # A digest ref resolves to a multi-platform index and Trivy defaults to linux/amd64, so the arm64 leg needs this.
      TRIVY_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
          persist-credentials: false

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build image for scan
        if: needs.prepare.outputs.publish != 'true'
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: ${{ env.SCAN_IMAGE }}
          build-args: |
            GIT_COMMIT=${{ needs.prepare.outputs.sha }}
          cache-from: type=gha,scope=${{ github.workflow }}-${{ matrix.suffix }}

      - name: Build and push candidate by digest
        if: needs.prepare.outputs.publish == 'true'
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ needs.prepare.outputs.meta-labels }}
          build-args: |
            GIT_COMMIT=${{ needs.prepare.outputs.sha }}
          # Explicit so the attestations don't silently change with repo visibility (the action
          # defaults provenance to mode=max only while the repo is public). mode=max embeds the
          # Dockerfile, build-arg values and the GitHub event payload: never pass a secret as a
          # build-arg (use secret mounts). sbom adds a BuildKit SBOM as an attestation on the
          # image itself, so Docker Scout and `docker buildx imagetools inspect` can read the
          # package list; the Trivy CycloneDX file on the GitHub Release is unchanged.
          provenance: mode=max
          sbom: true
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ github.workflow }}-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ github.workflow }}-${{ matrix.suffix }}

      - name: Select exact image for scan and smoke
        id: candidate
        env:
          PUBLISH: ${{ needs.prepare.outputs.publish }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          if [ "$PUBLISH" = 'true' ]; then
            [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
            echo "ref=ghcr.io/${{ github.repository }}@${DIGEST}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${SCAN_IMAGE}" >> "$GITHUB_OUTPUT"
          fi

      # Regression guard for the v0.7.3 mismatch: the revision label of the exact digest we are
      # about to publish must equal the commit this job checked out.
      - name: Verify revision label matches the checked-out commit
        if: needs.prepare.outputs.publish == 'true'
        env:
          IMAGE_REF: ${{ steps.candidate.outputs.ref }}
          EXPECTED_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          docker pull --quiet "$IMAGE_REF" >/dev/null
          actual="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE_REF")"
          if [ "$actual" != "$EXPECTED_SHA" ]; then
            echo "org.opencontainers.image.revision is '$actual' but the checked-out commit is '$EXPECTED_SHA'" >&2
            exit 1
          fi

      - name: Trivy vulnerability scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ steps.candidate.outputs.ref }}
          format: sarif
          output: trivy-results-${{ matrix.suffix }}.sarif
          scanners: vuln
          vuln-type: os,library
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          exit-code: 0

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63  # v4
        if: always()
        with:
          sarif_file: trivy-results-${{ matrix.suffix }}.sarif
          category: trivy-container-${{ matrix.suffix }}

      - name: Generate CycloneDX SBOM
        if: needs.prepare.outputs.publish == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ steps.candidate.outputs.ref }}
          format: cyclonedx
          output: sbom-${{ needs.prepare.outputs.artifact_slug }}-${{ matrix.suffix }}.cdx.json
          skip-setup-trivy: true

      - name: Upload SBOM workflow artifact
        if: needs.prepare.outputs.publish == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom-${{ matrix.suffix }}
          path: sbom-${{ needs.prepare.outputs.artifact_slug }}-${{ matrix.suffix }}.cdx.json
          retention-days: 90

      - name: Trivy gate (CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ steps.candidate.outputs.ref }}
          format: table
          scanners: vuln
          vuln-type: os,library
          ignore-unfixed: true
          severity: CRITICAL
          exit-code: 1
          skip-setup-trivy: true

      - name: Smoke-test this exact platform digest
        if: needs.prepare.outputs.publish == 'true'
        env:
          ADMITTO_IMAGE: ${{ steps.candidate.outputs.ref }}
        run: bash deploy/scripts/smoke-image.sh

      - name: Export digest
        if: needs.prepare.outputs.publish == 'true'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: needs.prepare.outputs.publish == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: digests-${{ matrix.suffix }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Combines the two per-platform digests pushed above into one multi-arch manifest under the
  # real release tags, attests provenance for that manifest, and attaches both platforms' SBOMs
  # to the GitHub Release.
  merge-and-publish:
    needs: [prepare, build-and-scan]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      # checkout only - GitHub Release/SBOM upload below authenticates via a dedicated GitHub App
      # token instead of GITHUB_TOKEN, see the "Mint release automation token" step.
      contents: read
      packages: write # docker login + push the merged multi-arch manifest to ghcr.io
      id-token: write # OIDC token for signing the provenance attestation
      attestations: write # write the provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
          persist-credentials: false

      # See release.yml's own comment on its identical step for the full rationale.
      # permission-contents pins the minted token to only what "Upload SBOMs to GitHub Release"
      # below needs, regardless of what else the App's installation is ever granted.
      - name: Mint release automation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to docker.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: |
            ghcr.io/${{ github.repository }}
            docker.io/solarssk/admitto
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.tag }}

      - name: Create and push multi-arch manifest (ghcr.io)
        id: manifest
        working-directory: /tmp/digests
        run: |
          # shellcheck disable=SC2046 # word-splitting is intentional here: each of these two
          # substitutions must expand into several separate "-t <tag>" / "<image>@sha256:<hash>"
          # arguments, not one combined string - quoting them would break the command by passing
          # everything as a single argument instead of the several imagetools create actually needs.
          docker buildx imagetools create \
            --metadata-file /tmp/manifest-metadata.json \
            $(jq -cr '.tags | map(select(startswith("ghcr.io/"))) | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)
          echo "digest=$(jq -r '.["containerimage.descriptor"].digest' /tmp/manifest-metadata.json)" >> "$GITHUB_OUTPUT"

      # A single `imagetools create` cannot fan a manifest out to tags in two different registries
      # in one call - BuildKit's image exporter treats a repeated `name=` attribute as a map key,
      # so the second occurrence silently overwrites the first rather than adding a destination
      # (confirmed against docs.docker.com/build/exporters/image-registry/, and against a real
      # user report of the same failure even with the "correct" quoted multi-name syntax). Instead,
      # copy the already-published ghcr.io manifest into docker.io by digest - the documented
      # cross-registry-copy pattern (docs.docker.com/build/ci/github-actions/copy-image-registries).
      - name: Copy and tag multi-arch manifest (docker.io)
        run: |
          # shellcheck disable=SC2046 # see the word-splitting note on the ghcr.io step above.
          docker buildx imagetools create \
            $(jq -cr '.tags | map(select(startswith("docker.io/"))) | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            ghcr.io/${{ github.repository }}@${{ steps.manifest.outputs.digest }}

      - name: Verify manifest landed identically on both registries
        run: |
          set -euo pipefail
          DIGEST="${{ steps.manifest.outputs.digest }}"
          for IMG in "ghcr.io/${{ github.repository }}" "docker.io/solarssk/admitto"; do
            echo "Verifying ${IMG}@${DIGEST}"
            docker buildx imagetools inspect "${IMG}@${DIGEST}" >/dev/null
          done

      - name: Attest build provenance (ghcr.io)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

      - name: Attest build provenance (docker.io)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: docker.io/solarssk/admitto
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

      - name: Download SBOMs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: /tmp/sboms
          pattern: sbom-*
          merge-multiple: true

      - name: Upload SBOMs to GitHub Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          TAG="${{ needs.prepare.outputs.tag }}"
          VERSION="${TAG#v}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" /tmp/sboms/*.cdx.json --clobber
          else
            NOTES=".github/release-notes/v${VERSION}.md"
            if [ -f "$NOTES" ]; then
              DISPLAY_TITLE="$(bash scripts/release-display-title.sh "$VERSION")"
              gh release create "$TAG" --title "$DISPLAY_TITLE" --notes-file "$NOTES" --latest /tmp/sboms/*.cdx.json
            else
              gh release create "$TAG" --title "$TAG" --generate-notes --latest /tmp/sboms/*.cdx.json
            fi
          fi

      # Kept last on purpose: a failure here (e.g. a Docker Hub token without description
      # write scope) must not skip the SBOM upload to the GitHub Release above.
      - name: Sync Docker Hub repository description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa  # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: solarssk/admitto
          short-description: "Self-hosted registration-to-check-in for internal corporate events. No SaaS, no recurring fees."
          readme-filepath: deploy/dockerhub-readme.md
