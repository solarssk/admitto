name: Publish container

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build (semver tag publishes; branch ref scan-only)
        required: true
        default: refs/heads/main

permissions:
  # contents: write — release upload/create only; job-wide is standard for publish workflows.
  contents: write
  packages: write
  security-events: write
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      SCAN_IMAGE: ghcr.io/${{ github.repository }}:ci-scan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
          persist-credentials: false

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Resolve release tag
        id: release
        env:
          # inputs.ref is attacker-controllable (anyone with dispatch access chooses it) — never
          # interpolate it directly into the run: script text, which GitHub substitutes as raw
          # characters before bash parses them (script injection, SonarCloud githubactions:S7630).
          # Passing it through env: makes it a normal shell variable value instead.
          DISPATCH_REF: ${{ inputs.ref }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REF="$DISPATCH_REF"
          else
            REF="${GITHUB_REF}"
          fi
          case "$REF" in
            refs/tags/*)
              TAG="${REF#refs/tags/}"
              if printf '%s' "$TAG" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
                echo "publish=true" >> "$GITHUB_OUTPUT"
                echo "artifact_slug=${TAG}" >> "$GITHUB_OUTPUT"
              else
                echo "publish=false" >> "$GITHUB_OUTPUT"
                echo "artifact_slug=ci-scan" >> "$GITHUB_OUTPUT"
              fi
              ;;
            *)
              TAG="${REF#refs/heads/}"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "artifact_slug=ci-scan" >> "$GITHUB_OUTPUT"
              ;;
          esac
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        if: steps.release.outputs.publish == 'true'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.release.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release.outputs.tag }}

      - name: Build image for scan
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: ${{ env.SCAN_IMAGE }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha

      - name: Trivy vulnerability scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ env.SCAN_IMAGE }}
          format: sarif
          output: trivy-results.sarif
          scanners: vuln
          vuln-type: os,library
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          exit-code: 0

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd  # v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container

      - name: Generate CycloneDX SBOM
        if: steps.release.outputs.publish == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ env.SCAN_IMAGE }}
          format: cyclonedx
          output: sbom-${{ steps.release.outputs.artifact_slug }}.cdx.json
          skip-setup-trivy: true

      - name: Upload SBOM workflow artifact
        if: steps.release.outputs.publish == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom-${{ steps.release.outputs.artifact_slug }}
          path: sbom-${{ steps.release.outputs.artifact_slug }}.cdx.json
          retention-days: 90

      - name: Trivy gate (CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ env.SCAN_IMAGE }}
          format: table
          scanners: vuln
          vuln-type: os,library
          ignore-unfixed: true
          severity: CRITICAL
          exit-code: 1
          skip-setup-trivy: true

      - name: Push image to GHCR
        if: steps.release.outputs.publish == 'true'
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest build provenance
        if: steps.release.outputs.publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Upload SBOM to GitHub Release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.release.outputs.tag }}"
          SBOM="sbom-${{ steps.release.outputs.artifact_slug }}.cdx.json"
          VERSION="${TAG#v}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$SBOM" --clobber
          else
            NOTES=".github/release-notes/v${VERSION}.md"
            if [ -f "$NOTES" ]; then
              DISPLAY_TITLE="$(bash scripts/release-display-title.sh "$VERSION")"
              gh release create "$TAG" --title "$DISPLAY_TITLE" --notes-file "$NOTES" --latest "$SBOM"
            else
              gh release create "$TAG" --title "$TAG" --generate-notes --latest "$SBOM"
            fi
          fi
