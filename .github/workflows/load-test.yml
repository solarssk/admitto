name: Check-in load test

# k6 against the check-in hot path (POST /api/checkin/admit): several operator accounts admitting
# many different attendees in parallel, plus a contested set where several operators admit the same
# attendee at once. Scheduled and manual, plus a run on PRs that touch this workflow or its scripts
# (so a change to them is exercised before merge, like cflite_pr.yml). Never a required check for
# anything else: it is slow and its numbers need a baseline before they can gate anything.
#
# Fails the run on correctness only: any non-200 or unexpected response from the API (a fresh
# attendee must come back VALID), and, checked straight in the database afterwards, any attendee
# with more than one VALID check-in row (a double admit) or any contested attendee that did not end
# up with exactly one. Latency (p95/p99), error rate and throughput are recorded in the job summary, with the
# full k6 output uploaded as an artifact, so a baseline can build up before any threshold is set.
#
# Runs the app the same way apps/admin/playwright.config.ts does (dev-mode server, ephemeral
# Postgres and Redis service containers), so no compose stack is needed. Out of scope for now: the
# SSE check-in stream under load (k6 has no native SSE support).

on:
  pull_request:
    paths:
      - ".github/workflows/load-test.yml"
      - "scripts/load-test/**"
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 2" # weekly, Tuesday 05:00 UTC

concurrency:
  group: load-test
  cancel-in-progress: false

permissions:
  contents: read

env:
  # No password: the Postgres service container runs with POSTGRES_HOST_AUTH_METHOD=trust and is
  # unreachable outside this job (same convention as ci.yml).
  DATABASE_URL: postgresql://admitto@localhost:5432/admitto
  REDIS_URL: redis://localhost:6379
  ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  PORT: "3100"
  BASE_URL: http://localhost:3100
  # scripts/load-test/seed.ts refuses to write without this deliberate opt-in; this job's Postgres
  # is ephemeral, so it is safe to set here.
  E2E_SEED_ALLOW_WRITE: "true"

jobs:
  checkin-load:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: admitto
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: admitto
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24.17.0"
          cache: "npm"
      # See ci.yml's lint-and-typecheck job for why install runs with --ignore-scripts.
      - run: npm ci --ignore-scripts
      - run: npm rebuild esbuild argon2 @prisma/engines prisma @prisma/client
      - run: npm run db:generate -w @admitto/db
      - run: npm run build
      - name: Migrate database
        run: npm run db:migrate -w @admitto/db
      # 9 operators = one per k6 VU (3 for the contested scenario, 6 for the distinct one); 12 of
      # the 512 attendees are the contested set, the rest are admitted once each.
      - name: Seed operators and attendees
        run: node --import tsx scripts/load-test/seed.ts 9 512 12 "$RUNNER_TEMP/load-seed.json"
      - name: Start the app
        working-directory: apps/web
        run: |
          NODE_ENV=development nohup node --import tsx src/index.ts > "$RUNNER_TEMP/web.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf "$BASE_URL/healthz" >/dev/null && exit 0
            sleep 2
          done
          echo "app never became healthy"
          cat "$RUNNER_TEMP/web.log"
          exit 1
      - uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1  # v1.2.2
        with:
          k6-version: "2.3.0"
      - name: Run k6
        env:
          SEED_FILE: ${{ runner.temp }}/load-seed.json
        run: k6 run scripts/load-test/checkin.k6.js
      - name: No attendee was admitted twice
        if: always()
        run: |
          DOUBLES=$(psql "$DATABASE_URL" -Atc "select count(*) from (select attendee_id from \"CheckIn\" where status = 'VALID' group by attendee_id having count(*) > 1) t")
          echo "attendees with more than one VALID check-in: $DOUBLES"
          [ "$DOUBLES" = "0" ]
      - name: Every contested attendee was admitted exactly once
        if: always()
        run: |
          IDS=$(jq -r '.contestedIds | join(",")' "$RUNNER_TEMP/load-seed.json")
          EXPECTED=$(jq '.contestedIds | length' "$RUNNER_TEMP/load-seed.json")
          WON=$(psql "$DATABASE_URL" -Atc "select count(*) from (select attendee_id from \"CheckIn\" where status = 'VALID' and attendee_id = any(string_to_array('$IDS', ',')) group by attendee_id having count(*) = 1) t")
          echo "contested attendees admitted exactly once: $WON of $EXPECTED"
          [ "$WON" = "$EXPECTED" ]
      - name: Job summary
        if: always()
        run: |
          [ -f k6-summary.md ] && cat k6-summary.md >> "$GITHUB_STEP_SUMMARY" || echo "k6 produced no summary" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload k6 output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: k6-checkin-load
          path: |
            k6-summary.md
            k6-summary.json
          retention-days: 30
          if-no-files-found: ignore
