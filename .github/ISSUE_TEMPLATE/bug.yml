name: Bug report
description: Something is not working correctly
labels: ["type: bug"]
body:
  - type: markdown
    attributes:
      value: >
        Thanks for reporting a bug. For a new capability or change request, use the
        **Task** template instead. Check the
        [Wiki](https://github.com/solarssk/admitto/wiki) if you're unsure whether
        something is a bug or expected behaviour.
  - type: input
    id: version
    attributes:
      label: Product version
      description: The version you're running (e.g. `v0.4.13`).
      placeholder: v0.4.13
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / error output
      description: >
        Paste relevant log output. **Remove all secrets, passwords, tokens, and
        personal data before posting.**
  - type: textarea
    id: health-snapshot
    attributes:
      label: Health check snapshot
      description: >
        If relevant, paste the output of Settings → Health check → **Copy for GitHub
        Issue**.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - mailer
        - db
        - import
        - checkin
        - tickets
        - passcreator
        - ui
        - infra
        - other
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser
      description: Which browser (and version), if this is a UI bug.
      placeholder: e.g. Chrome 128
  - type: checkboxes
    id: confirmations
    attributes:
      label: Please confirm
      options:
        - label: >
            I removed all secrets, tokens, and attendee personal data from the Logs and
            Health check snapshot fields above.
          required: true
