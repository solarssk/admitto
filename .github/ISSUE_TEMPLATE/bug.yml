name: Bug report
description: Something is not working correctly
labels: ["type: bug"]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / error output
      description: >
        Paste relevant log output. **Remove all secrets, passwords, tokens, and
        personal data before posting.**
  - type: textarea
    id: health-snapshot
    attributes:
      label: Health check snapshot
      description: >
        If relevant, paste the output of Settings → Health check → **Copy for GitHub
        Issue**.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - mailer
        - db
        - import
        - checkin
        - tickets
        - passcreator
        - ui
        - infra
        - other
    validations:
      required: true
