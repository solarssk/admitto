version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Auto-rebase-on-conflict was observed leaving package-lock.json's resolved tree stale
    # (declared versions right, hoisted node_modules entries wrong) after two concurrent
    # dependabot PRs bumped the same package; npm ci didn't catch it. Disabling stops that
    # automatic in-place patch: a base-branch conflict now leaves the PR conflicted instead
    # of silently repatching it. Resolve manually - comment `@dependabot recreate` for a
    # fresh lockfile resolve, or close/reopen - CI's lockfile check (verify-lockfile-
    # resolutions.py) is the backstop if a conflict does get auto-resolved some other way.
    rebase-strategy: "disabled"
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action/*"
