version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Auto-rebase-on-conflict was observed leaving package-lock.json's resolved tree stale
    # (declared versions right, hoisted node_modules entries wrong) after two concurrent
    # dependabot PRs bumped the same package; npm ci didn't catch it. Disabling forces a
    # PR recreation (full lockfile resolve) instead of an in-place patch on conflict.
    rebase-strategy: "disabled"
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action/*"
