version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Auto-rebase-on-conflict was observed leaving package-lock.json's resolved tree stale
    # (declared versions right, hoisted node_modules entries wrong) after two concurrent
    # dependabot PRs bumped the same package; npm ci didn't catch it. Disabling stops that
    # automatic in-place patch: a base-branch conflict now leaves the PR conflicted instead
    # of silently repatching it. Resolve manually - comment `@dependabot recreate` for a
    # fresh lockfile resolve, or close/reopen - CI's lockfile check (verify-lockfile-
    # resolutions.py) is the backstop if a conflict does get auto-resolved some other way.
    rebase-strategy: "disabled"
    # Each group below is a peer-version pair split across two different package names, so a
    # same-target-version bump lands in one PR instead of two independent ones. Without this,
    # Dependabot bundles same-*name* bumps across every workspace's package.json into one PR
    # (that part already works, e.g. vitest itself) but never bundles across *different* names,
    # even when one requires the other at an exact matching version - merging just one half then
    # leaves package-lock.json unresolvable, caught (not prevented) by verify-lockfile-
    # resolutions.py. Confirmed broken this way for vitest / @vitest/coverage-v8 (PR #1256 vs
    # #1254, both bumping 4.1.11 -> 5.0.0 independently) - the same class of bug PR #1035 first
    # patched a symptom of, and PR #734 fixed manually pre-Dependabot-groups.
    groups:
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      prisma:
        # packages/db pins these two to the identical version on adjacent lines; @prisma/client
        # will not run against a mismatched prisma CLI/engine version.
        patterns:
          - "prisma"
          - "@prisma/*"
      typescript-eslint:
        patterns:
          - "@typescript-eslint/*"
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action/*"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
  # The runtime deploy stack (deploy/docker-compose.yml) pins its own images separately from the
  # root Dockerfile above - without this entry, Dependabot never watches postgres/redis/nginx CVEs
  # or upstream releases in what self-hosters actually run.
  - package-ecosystem: "docker"
    directory: "/deploy"
    schedule:
      interval: "weekly"
