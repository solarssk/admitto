services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: admitto
      POSTGRES_PASSWORD: admitto
      POSTGRES_DB: admitto
    ports:
      # Loopback only — default dev creds must not be reachable on the LAN.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admitto"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
