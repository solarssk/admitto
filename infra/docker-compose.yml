services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: admitto
      POSTGRES_PASSWORD: admitto
      POSTGRES_DB: admitto
    ports:
      # Loopback only — default dev creds must not be reachable on the LAN.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admitto"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # Bound memory even if a misconfigured proxy lets attackers fan out spoofed client IPs.
    command: redis-server --maxmemory 256mb --maxmemory-policy volatile-ttl
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  postgres_data:
