# Prep config for a future CI-based SonarCloud analysis (a `sonar-scanner` step actually running
# in GitHub Actions, authenticated with a SONAR_TOKEN secret). NOT read today: this repo's
# SonarCloud project currently uses Automatic Analysis (the GitHub App, no CI scanner step), which
# reads .sonarcloud.properties instead and never looks at this file - confirmed directly from
# SonarSource's own docs ("Note that this is different from the sonar-project.properties file used
# for CI-based analysis"). See docs/dev/sonarcloud-ci-coverage-migration.md for the full sourced
# reasoning, why this file exists ahead of the actual migration, and the exact remaining steps
# (all blocked on a human generating a SONAR_TOKEN and disabling Automatic Analysis).
#
# This file has no effect until both of those human steps are done AND a `sonarqube-scan-action`
# step is added to .github/workflows/ci.yml (see the migration doc for the exact job). Until then
# it is inert - Automatic Analysis ignores it entirely.

sonar.projectKey=solarssk_admitto
sonar.organization=recmedia

# Same test classification as .sonarcloud.properties. sonar.tests does not support wildcards under
# any SonarQube Cloud analysis mode (confirmed in SonarSource's "Setting initial scope" docs - this
# is a property-level restriction, not specific to Automatic Analysis), so every workspace's test/
# directory is listed explicitly here too, plus the shell test harnesses ci.yml runs outside any
# workspace test/ directory and the fixtures they read.
sonar.tests=apps/web/test,apps/admin/test,apps/cli/test,packages/auth/test,packages/crypto/test,packages/db/test,packages/import/test,packages/location/test,packages/mail-delivery/test,packages/mail-templates/test,packages/mailer-config/test,packages/mailer/test,packages/shared/test,packages/storage/test,packages/tickets/test,packages/ui/test,packages/wallet/test,scripts/check-migrations-destructive.test.sh,scripts/test-migrate-entrypoint.sh,scripts/fixtures

# LCOV reports produced by `npm run coverage` (see vitest.coverage.ts) - the same files ci.yml's
# test-web/test-admin/test-rest jobs already upload to Codecov today. Unlike sonar.tests above,
# this property does support wildcards and comma-delimited lists (SonarSource's JS/TS test
# coverage docs), so a glob per report kind is enough instead of listing every workspace by hand.
sonar.javascript.lcov.reportPaths=apps/*/coverage/lcov.info,apps/*/coverage-integration/lcov.info,packages/*/coverage/lcov.info,packages/*/coverage-integration/lcov.info
