# Read by CI-based SonarCloud analysis (the `sonarcloud` job in .github/workflows/ci.yml,
# authenticated with the SONAR_TOKEN secret). Automatic Analysis (the GitHub App) is off - this
# file is the live config now, not .sonarcloud.properties (that file is now dead weight, kept only
# because it does no harm). See docs/dev/sonarcloud-ci-coverage-migration.md for the full sourced
# migration history.

sonar.projectKey=solarssk_admitto
sonar.organization=recmedia

# Explicit, not left to the documented "defaults to '.'" behavior: empirically, the first two
# CI-based analyses on this project (2026-09-04) indexed only the ~760 files under sonar.tests's
# own directories and none of the ~1200 files elsewhere (all of apps/*/src, packages/*/src - every
# real production file) - confirmed via the SonarCloud API component tree (zero FIL-qualifier
# components, every indexed path a test dir) and by counting `git ls-files` against the sonar.tests
# path list directly (760 vs. the scanner's own reported "762 files"). Root cause not confirmed
# (ALM-bound "auto-configure" scanning may resolve the missing sonar.sources differently than a
# vanilla project), but setting this explicitly removes the ambiguity regardless of the mechanism.
sonar.sources=.

# Same test classification as .sonarcloud.properties. sonar.tests does not support wildcards under
# any SonarQube Cloud analysis mode (confirmed in SonarSource's "Setting initial scope" docs - this
# is a property-level restriction, not specific to Automatic Analysis), so every workspace's test/
# directory is listed explicitly here too, plus the shell test harnesses ci.yml runs outside any
# workspace test/ directory and the fixtures they read.
sonar.tests=apps/web/test,apps/admin/test,apps/admin/e2e,apps/cli/test,packages/auth/test,packages/crypto/test,packages/db/test,packages/import/test,packages/location/test,packages/mail-delivery/test,packages/mail-templates/test,packages/mailer-config/test,packages/mailer/test,packages/shared/test,packages/storage/test,packages/tickets/test,packages/ui/test,packages/wallet/test,scripts/check-migrations-destructive.test.sh,scripts/test-migrate-entrypoint.sh,scripts/fixtures

# sonar.sources defaults to "." when unset, which re-includes every path above as source too -
# sonar.tests alone doesn't remove them from sonar.sources, and the scanner rejects a project
# whose source and test paths overlap, failing the whole analysis before it gets anywhere near
# importing the LCOV data below. Mirrors .sonarcloud.properties's own sonar.exclusions exactly
# (with a trailing /** since these are exclusion globs, not the classification list above) so
# each path is source-excluded and test-included, never both - same fix that file already needed
# for Automatic Analysis, just as required here for CI-based analysis (caught by review before
# this shipped, since a scanner-mode overlap couldn't be tested without the token this whole file
# is prepped ahead of).
sonar.exclusions=apps/web/test/**,apps/admin/test/**,apps/admin/e2e/**,apps/cli/test/**,packages/auth/test/**,packages/crypto/test/**,packages/db/test/**,packages/import/test/**,packages/location/test/**,packages/mail-delivery/test/**,packages/mail-templates/test/**,packages/mailer-config/test/**,packages/mailer/test/**,packages/shared/test/**,packages/storage/test/**,packages/tickets/test/**,packages/ui/test/**,packages/wallet/test/**,scripts/check-migrations-destructive.test.sh,scripts/test-migrate-entrypoint.sh,scripts/fixtures/**,packages/db/prisma/migrations/**

# packages/db/prisma/migrations/** above: same plain exclusion as .sonarcloud.properties - see
# that file's comment for the full reasoning (already-applied migrations are unsafe to edit for
# any finding, and every open finding there was a generic Oracle-oriented plsql rule misreading
# intentional Postgres SQL, none security-relevant).

# LCOV reports produced by `npm run coverage` (see vitest.coverage.ts) - the same files ci.yml's
# test-web/test-admin/test-rest jobs already upload to Codecov today. Unlike sonar.tests above,
# this property does support wildcards and comma-delimited lists (SonarSource's JS/TS test
# coverage docs), so a glob per report kind is enough instead of listing every workspace by hand.
sonar.javascript.lcov.reportPaths=apps/*/coverage/lcov.info,apps/*/coverage-integration/lcov.info,packages/*/coverage/lcov.info,packages/*/coverage-integration/lcov.info
