# Overlay for scripts/test-migrate-entrypoint.sh only.
# Uses .env.smoke (gitignored) instead of deploy/.env so a local stack is untouched.
services:
  migrate:
    env_file: !override
      - .env.smoke
  app:
    env_file: !override
      - .env.smoke
  db:
    env_file: !override
      - .env.smoke
  redis:
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
  worker:
    env_file: !override
      - .env.smoke
    profiles:
      - migration-smoke-skip
  db-backup:
    env_file: !override
      - .env.smoke
    profiles:
      - migration-smoke-skip
