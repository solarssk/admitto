# Second hop behind Nginx Proxy Manager (loopback :8080 only).
#
# Trust boundary: NPM must OVERWRITE X-Forwarded-For to the real client IP
# (proxy_set_header X-Forwarded-For $remote_addr) — never $proxy_add_x_forwarded_for.
#
# real_ip: immediate peer is NPM on the host connecting to loopback :8080 (see deploy/README.md).
# If NPM runs in Docker and reaches the host via the bridge gateway (often 172.17.0.1), add that
# address here — do not trust whole RFC1918 ranges.
set_real_ip_from 127.0.0.1;
real_ip_header X-Forwarded-For;
real_ip_recursive off;

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

upstream admitto_app {
  server app:3000;
}

server {
  listen 80;
  server_name _;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  # Single client IP only — never forward a client-supplied XFF chain (ADR 0012/0013).
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $forwarded_proto;
  proxy_set_header Connection "";

  location ~ ^/api/admin/events/[^/]+/metrics/stream$ {
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_pass http://admitto_app;
  }

  location / {
    proxy_pass http://admitto_app;
  }
}
