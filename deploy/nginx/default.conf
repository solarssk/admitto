# Second hop behind Nginx Proxy Manager (loopback :8080 only).
# Trust boundary: NPM sanitizes client headers; we pass NPM's values through to the app.
map $http_x_forwarded_for $forwarded_for {
    default $http_x_forwarded_for;
    ""      $remote_addr;
}

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

upstream admitto_app {
  server app:3000;
}

server {
  listen 80;
  server_name _;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $forwarded_for;
  proxy_set_header X-Forwarded-Proto $forwarded_proto;
  proxy_set_header Connection "";

  location ~ ^/api/admin/events/[^/]+/metrics/stream$ {
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_pass http://admitto_app;
  }

  location / {
    proxy_pass http://admitto_app;
  }
}
