# Second hop behind Nginx Proxy Manager (loopback :8080 only).
#
# Trust boundary: NPM must OVERWRITE X-Forwarded-For to the real client IP
# (proxy_set_header X-Forwarded-For $remote_addr) — never $proxy_add_x_forwarded_for.
#
# real_ip: immediate peer is NPM on the host connecting to loopback :8080 (see deploy/README.md).
# If NPM runs in Docker and reaches the host via the bridge gateway (often 172.17.0.1), that address
# is trusted below — do not trust whole RFC1918 ranges.
set_real_ip_from 127.0.0.1;
set_real_ip_from 172.17.0.1;
real_ip_header X-Forwarded-For;
real_ip_recursive off;

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# $host omits non-default ports; CSRF Origin from the browser includes :8080 on local smoke.
map $http_host $forwarded_host {
    default $http_host;
    ""      $host;
}

upstream admitto_app {
  server app:3000;
}

server {
  listen 80;
  server_name _;

  # Global baseline headers (HSTS is safe here when NPM terminates TLS and sets X-Forwarded-Proto).
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy same-origin always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  proxy_http_version 1.1;
  proxy_set_header Host $forwarded_host;
  # CSRF origin check (same-origin-post.ts) uses X-Forwarded-Host when TRUST_PROXY=true.
  proxy_set_header X-Forwarded-Host $forwarded_host;
  # Single client IP only — never forward a client-supplied XFF chain (ADR 0012/0013).
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $forwarded_proto;
  proxy_set_header Connection "";

  location ~ ^/api/checkin/events/[^/]+/stream$ {
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_pass http://admitto_app;
  }

  location / {
    proxy_pass http://admitto_app;
  }
}
