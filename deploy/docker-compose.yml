services:
  # One-shot: migration status check, pre-migration backup, `migrate deploy`, and backfills -
  # steps that need root (to write into the root-only migration_backups volume) or must complete
  # before the web server accepts traffic. The `app` service below only starts once this exits 0
  # (docker:S6471 - app itself never runs as root). Retention runs on the Admitto worker (ADR 0042).
  migrate:
    image: ${ADMITTO_IMAGE:-ghcr.io/solarssk/admitto:local}
    build:
      context: ..
      dockerfile: Dockerfile
    user: root
    command: ["migrate"]
    # Disables the image's inherited HEALTHCHECK (a port-3000 HTTP probe meant for `app`'s server) -
    # this container never listens on anything, so that probe can only ever report false-unhealthy
    # while a slow pg_dump/backfill is still legitimately running.
    healthcheck:
      disable: true
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      MIGRATION_BACKUP_DIR: /backups
      EMERGENCY_EXPORT_DIR: /app/emergency-exports
    volumes:
      - migration_backups:/backups
      - ./emergency-exports:/app/emergency-exports
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  app:
    image: ${ADMITTO_IMAGE:-ghcr.io/solarssk/admitto:local}
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["serve"]
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      TRUST_PROXY: "true"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      EMERGENCY_EXPORT_DIR: /app/emergency-exports
      UPLOAD_DIR: /app/uploads
      # JSON access log on app stdout (method, redacted path, status, duration -
      # no IPs, tokens, or query strings). Set LOG_HTTP_REQUESTS=0 in .env to disable.
      LOG_HTTP_REQUESTS: ${LOG_HTTP_REQUESTS:-1}
    volumes:
      - ./emergency-exports:/app/emergency-exports
      - ./uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    restart: unless-stopped
    networks:
      - internal

  db:
    image: postgres:16-alpine
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - internal

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - sh
      - -c
      - redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 256mb --maxmemory-policy volatile-ttl
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - internal

  proxy:
    image: nginx:alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    networks:
      - internal

  # Admitto worker: mail drain, import/export jobs, bounce ingest, retention (ADR 0042).
  # replicas: 1 + session advisory locks in the worker process.
  worker:
    image: ${ADMITTO_IMAGE:-ghcr.io/solarssk/admitto:local}
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["worker"]
    restart: unless-stopped
    # Long-running tick jobs; Health uses DB heartbeat instead of a Docker probe.
    healthcheck:
      disable: true
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      BOUNCE_INGEST_APP_URL: http://app:3000
      ADMITTO_INTERNAL_URL: http://app:3000
      # Same bind as `app` so import/export AdminJobs see staged files and write downloads.
      UPLOAD_DIR: /app/uploads
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_started
    deploy:
      replicas: 1
    networks:
      - internal

  db-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      MIGRATION_BACKUP_DIR: /backups
    entrypoint: ["/bin/sh", "/scripts/nightly-db-backup-loop.sh"]
    volumes:
      - migration_backups:/backups
      - ./scripts/nightly-db-backup-loop.sh:/scripts/nightly-db-backup-loop.sh:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  # IMAP bounce / NDR ingest and scheduled retention now run inside the `worker` service (ADR 0042).

networks:
  # Fixed subnet (Compose otherwise auto-assigns one) so TRUSTED_PROXY_CIDRS in .env can name it -
  # the app trusts X-Forwarded-* only from a peer inside this range (see deploy/README.md).
  internal:
    ipam:
      config:
        - subnet: 172.28.238.0/24

volumes:
  postgres_data:
  migration_backups:
